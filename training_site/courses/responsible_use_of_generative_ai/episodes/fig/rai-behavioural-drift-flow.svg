<text x="152.8" y="135.0" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">research task</text>
<text x="376.40000000000003" y="113.0" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Convenient AI</text>
