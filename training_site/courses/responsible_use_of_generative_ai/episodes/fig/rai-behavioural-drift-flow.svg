<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">Behavioural drift risk flow</title>
  <desc id="desc">Convenient AI use can reduce deliberation and normalise exposure across teaching and research activity.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#405162"/>
    </marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="145%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#10263b" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="1200" height="260" rx="28" fill="#f7fbfc"/>

  <g filter="url(#shadow)">
    <rect x="55" y="82" width="200" height="100" rx="18" fill="#006781"/>
    <rect x="282" y="82" width="200" height="100" rx="18" fill="#298582"/>
    <rect x="509" y="82" width="200" height="100" rx="18" fill="#405162"/>
    <rect x="736" y="82" width="200" height="100" rx="18" fill="#009bc1"/>
    <rect x="963" y="82" width="182" height="100" rx="18" fill="#10263b"/>
  </g>

  <g stroke="#405162" stroke-width="5" marker-end="url(#arrow)" fill="none">
    <path d="M263 132 H274"/>
    <path d="M490 132 H501"/>
    <path d="M717 132 H728"/>
    <path d="M944 132 H955"/>
  </g>

  <g font-family="sans-serif" font-weight="700" fill="#ffffff" text-anchor="middle">
    <text x="155" y="116" font-size="15">Routine teaching</text>
    <text x="155" y="138" font-size="15">or research task</text>
    <text x="382" y="116" font-size="17">Convenient AI</text>
    <text x="382" y="138" font-size="17">shortcut</text>
    <text x="609" y="116" font-size="16">Reduced</text>
    <text x="609" y="138" font-size="16">deliberation</text>
    <text x="836" y="116" font-size="16">Normalised</text>
    <text x="836" y="138" font-size="16">exposure</text>
    <text x="1054" y="126" font-size="17">Elevated risk</text>
  </g>

  <g font-family="sans-serif" font-weight="700" fill="#405162" text-anchor="middle">
    <text x="600" y="225" font-size="14">small repeated choices can shift local norms before anyone has made an explicit policy decision</text>
  </g>
</svg>
