<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="title desc">
  <title id="title">A reproducible workflow for AI-generated research code</title>
  <desc id="desc">Keep the original data unchanged, run the code and inspect its output, record exclusions and calculated variables, then independently check a small calculation.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-25%" width="120%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#10263b" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#405162"/>
    </marker>
  </defs>

  <rect width="1200" height="350" rx="28" fill="#f7fbfc"/>

  <g fill="none" stroke="#405162" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M285 175 H325"/>
    <path d="M580 175 H620"/>
    <path d="M875 175 H915"/>
  </g>

  <g font-family="sans-serif" text-anchor="middle" filter="url(#shadow)">
    <rect x="35" y="76" width="250" height="198" rx="24" fill="#006781"/>
    <rect x="330" y="76" width="250" height="198" rx="24" fill="#298582"/>
    <rect x="625" y="76" width="250" height="198" rx="24" fill="#405162"/>
    <rect x="920" y="76" width="245" height="198" rx="24" fill="#10263b"/>
  </g>

  <g font-family="sans-serif" text-anchor="middle" fill="#ffffff">
    <text x="160" y="116" font-size="16" font-weight="800">1 · PROTECT</text>
    <text x="160" y="158" font-size="23" font-weight="700">Keep original</text>
    <text x="160" y="188" font-size="23" font-weight="700">data unchanged</text>
    <text x="160" y="231" font-size="15">work on a controlled copy</text>

    <text x="455" y="116" font-size="16" font-weight="800">2 · EXECUTE</text>
    <text x="455" y="158" font-size="23" font-weight="700">Run the code</text>
    <text x="455" y="188" font-size="23" font-weight="700">and inspect</text>
    <text x="455" y="231" font-size="15">check the actual output</text>

    <text x="750" y="116" font-size="16" font-weight="800">3 · RECORD</text>
    <text x="750" y="153" font-size="21" font-weight="700">Document exclusions</text>
    <text x="750" y="181" font-size="21" font-weight="700">and new variables</text>
    <text x="750" y="231" font-size="15">make transformations visible</text>

    <text x="1042" y="116" font-size="16" font-weight="800">4 · VERIFY</text>
    <text x="1042" y="153" font-size="21" font-weight="700">Check a small</text>
    <text x="1042" y="181" font-size="21" font-weight="700">calculation yourself</text>
    <text x="1042" y="231" font-size="15">use an independent route</text>
  </g>
</svg>
