<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">Three layers of AI-assisted research</title>
  <desc id="desc">A model works inside a tool, while a research workflow connects the tool to a defined task, permitted sources, human checks, and a recorded decision.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#10263b" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#405162"/>
    </marker>
  </defs>
  <rect width="1200" height="470" rx="28" fill="#f7fbfc"/>

  <g font-family="sans-serif" filter="url(#shadow)">
    <rect x="70" y="66" width="250" height="144" rx="24" fill="#006781"/>
    <rect x="475" y="66" width="250" height="144" rx="24" fill="#298582"/>
    <rect x="880" y="66" width="250" height="144" rx="24" fill="#10263b"/>
    <rect x="155" y="300" width="890" height="104" rx="24" fill="#405162"/>
  </g>

  <g fill="none" stroke="#405162" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M330 138 H458"/>
    <path d="M735 138 H863"/>
    <path d="M1005 220 C1005 258 965 270 925 291"/>
  </g>

  <g font-family="sans-serif" text-anchor="middle" fill="#ffffff">
    <text x="195" y="108" font-size="18" font-weight="800">1 · MODEL</text>
    <text x="195" y="143" font-size="24" font-weight="700">Works with content</text>
    <text x="195" y="175" font-size="16">generates · compares · classifies</text>

    <text x="600" y="108" font-size="18" font-weight="800">2 · TOOL</text>
    <text x="600" y="137" font-size="22" font-weight="700">Provides access</text>
    <text x="600" y="163" font-size="22" font-weight="700">and actions</text>
    <text x="600" y="190" font-size="15">files · search · code · interface</text>

    <text x="1005" y="108" font-size="18" font-weight="800">3 · WORKFLOW</text>
    <text x="1005" y="137" font-size="22" font-weight="700">Makes the work</text>
    <text x="1005" y="163" font-size="22" font-weight="700">usable</text>
    <text x="1005" y="190" font-size="15">stages · checks · records</text>

    <text x="600" y="340" font-size="21" font-weight="800">THE RESEARCHER SETS THE BOUNDARY</text>
    <text x="600" y="375" font-size="19">defined task · permitted sources · human judgement · saved decision</text>
  </g>
</svg>
