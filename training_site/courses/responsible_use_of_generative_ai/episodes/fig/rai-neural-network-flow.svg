<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Neural network learning flow</title>
  <desc id="desc">Input data moves through input and hidden layers to an output layer, while back-propagation adjusts the model.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2 2 L10 6 L2 10 Z" fill="#405162"/></marker>
    <marker id="arrow-light" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2 2 L10 6 L2 10 Z" fill="#009bc1"/></marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="145%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#10263b" flood-opacity="0.15"/></filter>
  </defs>
  <rect width="1200" height="340" rx="28" fill="#f7fbfc"/>
  <g stroke="#405162" stroke-width="4" marker-end="url(#arrow)" fill="none">
    <path d="M200 173 H240"/>
    <path d="M400 173 C450 173 445 96 490 96"/>
    <path d="M400 173 C450 173 445 246 490 246"/>
    <path d="M670 96 C725 96 720 173 770 173"/>
    <path d="M670 246 C725 246 720 173 770 173"/>
    <path d="M945 173 H990"/>
    <path d="M780 198 C660 310 420 310 330 225" stroke="#009bc1" stroke-dasharray="9 9" marker-end="url(#arrow-light)"/>
  </g><g filter="url(#shadow)" font-family="sans-serif">
    <rect x="55" y="130" width="145" height="86" rx="18" fill="#006781"/>
    <rect x="250" y="130" width="150" height="86" rx="18" fill="#298582"/>
    <rect x="500" y="55" width="170" height="82" rx="18" fill="#405162"/>
    <rect x="500" y="205" width="170" height="82" rx="18" fill="#009bc1"/>
    <rect x="780" y="130" width="165" height="86" rx="18" fill="#10263b"/>
    <rect x="1000" y="130" width="145" height="86" rx="18" fill="#006781"/>
  </g><g font-family="sans-serif">
<text x="127.5" y="178.0" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Input data</text>
<text x="325.0" y="178.0" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Input layer</text>
<text x="585.0" y="101.0" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Hidden layer</text>
<text x="585.0" y="251.0" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Hidden layer</text>
<text x="862.5" y="178.0" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Output layer</text>
<text x="1072.5" y="178.0" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Output data</text>
    <text x="565" y="318" font-size="15" font-weight="700" fill="#405162" text-anchor="middle">back-propagation adjusts the network</text>
  </g>
</svg>
