<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">AI compression of research lifecycle</title>
  <desc id="desc">AI can shorten paths between question framing, evidence synthesis, analysis, and dissemination.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2 2 L10 6 L2 10 Z" fill="#405162"/></marker>
    <marker id="arrow-light" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2 2 L10 6 L2 10 Z" fill="#009bc1"/></marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="145%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#10263b" flood-opacity="0.15"/></filter>
  </defs>
  <rect width="1200" height="330" rx="28" fill="#f7fbfc"/>
  <g stroke="#405162" stroke-width="5" marker-end="url(#arrow)" fill="none">
    <path d="M250 181 H335"/>
    <path d="M535 181 H620"/>
    <path d="M840 181 H935"/>
    <path d="M160 130 C265 40 675 40 735 128" stroke="#009bc1" stroke-dasharray="9 9" marker-end="url(#arrow-light)"/>
    <path d="M440 228 C560 300 915 300 1035 228" stroke="#009bc1" stroke-dasharray="9 9" marker-end="url(#arrow-light)"/>
  </g><g filter="url(#shadow)" font-family="sans-serif">
    <rect x="70" y="135" width="180" height="92" rx="18" fill="#006781"/>
    <rect x="345" y="135" width="190" height="92" rx="18" fill="#298582"/>
    <rect x="630" y="135" width="210" height="92" rx="18" fill="#405162"/>
    <rect x="945" y="135" width="180" height="92" rx="18" fill="#10263b"/>
  </g><g font-family="sans-serif">
<text x="160.0" y="186.0" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Question framing</text>
<text x="440.0" y="175.0" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Evidence</text>
<text x="440.0" y="197.0" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">synthesis</text>
<text x="735.0" y="175.0" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Analysis &amp;</text>
<text x="735.0" y="197.0" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">modelling</text>
<text x="1035.0" y="186.0" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Dissemination</text>
    <text x="450" y="52" font-size="15" font-weight="700" fill="#405162" text-anchor="middle">AI-assisted shortcut</text>
    <text x="745" y="306" font-size="15" font-weight="700" fill="#405162" text-anchor="middle">AI-assisted drafting</text>
  </g>
</svg>
