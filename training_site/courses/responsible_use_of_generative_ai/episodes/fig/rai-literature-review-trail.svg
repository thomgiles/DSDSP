<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">A traceable literature review workflow</title>
  <desc id="desc">A literature review moves from a question and method through searching, screening, extraction, synthesis, and reporting, while keeping a record of queries, decisions, source locations, and changes.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#10263b" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#405162"/>
    </marker>
  </defs>
  <rect width="1200" height="500" rx="28" fill="#f7fbfc"/>

  <g fill="none" stroke="#405162" stroke-width="5" marker-end="url(#arrow)">
    <path d="M215 174 H255"/><path d="M405 174 H445"/><path d="M595 174 H635"/>
    <path d="M785 174 H825"/><path d="M975 174 H1015"/>
  </g>

  <g font-family="sans-serif" text-anchor="middle" filter="url(#shadow)">
    <rect x="45" y="110" width="170" height="128" rx="22" fill="#006781"/>
    <rect x="255" y="110" width="150" height="128" rx="22" fill="#298582"/>
    <rect x="445" y="110" width="150" height="128" rx="22" fill="#405162"/>
    <rect x="635" y="110" width="150" height="128" rx="22" fill="#298582"/>
    <rect x="825" y="110" width="150" height="128" rx="22" fill="#006781"/>
    <rect x="1015" y="110" width="140" height="128" rx="22" fill="#10263b"/>
    <rect x="90" y="330" width="1020" height="92" rx="24" fill="#405162"/>
  </g>

  <g font-family="sans-serif" text-anchor="middle" fill="#ffffff">
    <text x="130" y="156" font-size="18" font-weight="700">Question</text>
    <text x="130" y="181" font-size="18" font-weight="700">+ method</text>
    <text x="130" y="209" font-size="14">decide the rules</text>

    <text x="330" y="168" font-size="20" font-weight="700">Search</text>
    <text x="330" y="197" font-size="14">find records</text>
    <text x="520" y="168" font-size="20" font-weight="700">Screen</text>
    <text x="520" y="197" font-size="14">apply criteria</text>
    <text x="710" y="168" font-size="20" font-weight="700">Extract</text>
    <text x="710" y="197" font-size="14">capture evidence</text>
    <text x="900" y="168" font-size="20" font-weight="700">Synthesise</text>
    <text x="900" y="197" font-size="14">compare findings</text>
    <text x="1085" y="168" font-size="20" font-weight="700">Report</text>
    <text x="1085" y="197" font-size="14">show the method</text>

    <text x="600" y="367" font-size="20" font-weight="800">KEEP THE TRAIL</text>
    <text x="600" y="398" font-size="18">exact searches · include/exclude decisions · source locations · corrections</text>
  </g>

  <g fill="none" stroke="#405162" stroke-width="4" stroke-dasharray="9 9">
    <path d="M130 250 V315 M330 250 V315 M520 250 V315 M710 250 V315 M900 250 V315 M1085 250 V315"/>
  </g>
</svg>
