<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Natural language processing pipeline</title>
  <desc id="desc">A language task starts with text input, breaks language into tokens, uses context to infer meaning, and produces outputs such as classification, summary, translation or answers.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#405162"/>
    </marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="145%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#10263b" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="28" fill="#f7fbfc"/>

  <g stroke="#405162" stroke-width="5" marker-end="url(#arrow)" fill="none">
    <path d="M245 160 H295"/>
    <path d="M475 160 H525"/>
    <path d="M705 160 H755"/>
    <path d="M935 160 H985"/>
  </g>

  <g filter="url(#shadow)" font-family="sans-serif">
    <rect x="60" y="92" width="185" height="136" rx="18" fill="#006781"/>
    <rect x="300" y="92" width="175" height="136" rx="18" fill="#298582"/>
    <rect x="530" y="92" width="175" height="136" rx="18" fill="#009bc1"/>
    <rect x="760" y="92" width="175" height="136" rx="18" fill="#405162"/>
    <rect x="990" y="62" width="155" height="62" rx="18" fill="#10263b"/>
    <rect x="990" y="134" width="155" height="62" rx="18" fill="#10263b"/>
    <rect x="990" y="206" width="155" height="62" rx="18" fill="#10263b"/>
  </g>

  <g font-family="sans-serif" font-weight="700" text-anchor="middle">
    <text x="152.5" y="132" font-size="19" fill="#ffffff">Human</text>
    <text x="152.5" y="157" font-size="19" fill="#ffffff">language</text>
    <text x="152.5" y="187" font-size="15" fill="#d8f4f8">documents</text>
    <text x="152.5" y="208" font-size="15" fill="#d8f4f8">questions</text>

    <text x="387.5" y="146" font-size="19" fill="#ffffff">Break text</text>
    <text x="387.5" y="171" font-size="19" fill="#ffffff">into tokens</text>
    <text x="387.5" y="201" font-size="15" fill="#dcf5ee">words and parts</text>

    <text x="617.5" y="132" font-size="19" fill="#ffffff">Represent</text>
    <text x="617.5" y="157" font-size="19" fill="#ffffff">meaning</text>
    <text x="617.5" y="187" font-size="15" fill="#e8fbff">context</text>
    <text x="617.5" y="208" font-size="15" fill="#e8fbff">relationships</text>

    <text x="847.5" y="132" font-size="19" fill="#ffffff">Apply a</text>
    <text x="847.5" y="157" font-size="19" fill="#ffffff">language task</text>
    <text x="847.5" y="187" font-size="15" fill="#eef3f7">classify</text>
    <text x="847.5" y="208" font-size="15" fill="#eef3f7">predict</text>

    <text x="1067.5" y="99" font-size="16" fill="#ffffff">Summarise</text>
    <text x="1067.5" y="171" font-size="16" fill="#ffffff">Translate</text>
    <text x="1067.5" y="243" font-size="16" fill="#ffffff">Answer</text>
  </g>

  <g fill="none" stroke="#009bc1" stroke-width="2.5" opacity="0.65">
    <path d="M88 70 C112 38 185 38 218 70"/>
    <path d="M324 248 C358 286 418 286 455 248"/>
    <path d="M558 70 C592 38 652 38 686 70"/>
    <path d="M782 248 C820 286 883 286 916 248"/>
  </g>
</svg>
