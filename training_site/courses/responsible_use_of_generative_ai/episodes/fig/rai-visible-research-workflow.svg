<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">Visible AI-assisted research workflow</title>
  <desc id="desc">The researcher defines the task and sources, drafts or extracts with AI support, checks the work against the sources, revises unsupported work, and records supported output and decisions.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#10263b" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#405162"/>
    </marker>
  </defs>
  <rect width="1200" height="480" rx="28" fill="#f7fbfc"/>

  <g fill="none" stroke="#405162" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)">
    <path d="M250 185 H285"/>
    <path d="M485 185 H520"/>
    <path d="M740 185 H765"/>
    <path d="M955 185 H985"/>
    <path d="M865 275 C820 395 445 410 390 265"/>
  </g>

  <g font-family="sans-serif" filter="url(#shadow)">
    <rect x="45" y="115" width="205" height="140" rx="24" fill="#006781"/>
    <rect x="295" y="115" width="190" height="140" rx="24" fill="#298582"/>
    <rect x="530" y="115" width="210" height="140" rx="24" fill="#405162"/>
    <path d="M865 95 L955 185 L865 275 L775 185 Z" fill="#10263b"/>
    <rect x="995" y="115" width="160" height="140" rx="24" fill="#009bc1"/>
  </g>

  <g font-family="sans-serif" text-anchor="middle" fill="#ffffff">
    <text x="147" y="151" font-size="16" font-weight="800">1</text>
    <text x="147" y="184" font-size="21" font-weight="700">Define task</text>
    <text x="147" y="215" font-size="16">choose sources</text>

    <text x="390" y="151" font-size="16" font-weight="800">2</text>
    <text x="390" y="184" font-size="20" font-weight="700">Draft / extract</text>
    <text x="390" y="215" font-size="16">with AI support</text>

    <text x="635" y="151" font-size="16" font-weight="800">3</text>
    <text x="635" y="184" font-size="20" font-weight="700">Check against</text>
    <text x="635" y="215" font-size="16">the sources</text>

    <text x="865" y="174" font-size="15" font-weight="800">EVIDENCE</text>
    <text x="865" y="202" font-size="18" font-weight="700">supports it?</text>
    <text x="1075" y="151" font-size="16" font-weight="800">4</text>
    <text x="1075" y="184" font-size="20" font-weight="700">Record</text>
    <text x="1075" y="213" font-size="15">output + decisions</text>
  </g>

  <g font-family="sans-serif" text-anchor="middle" font-weight="800" fill="#405162">
    <text x="974" y="153" font-size="14">YES</text>
    <rect x="580" y="365" width="170" height="38" rx="19" fill="#ffffff" stroke="#d8e3e8" stroke-width="2"/>
    <text x="665" y="390" font-size="15">NO · REVISE</text>
  </g>
</svg>
