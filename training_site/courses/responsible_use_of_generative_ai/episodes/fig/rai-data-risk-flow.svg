<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">AI service data risk in teaching and research</title>
  <desc id="desc">Teaching and research material can become a data-risk event when it leaves institutional control through an external AI service.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#405162"/>
    </marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="145%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#10263b" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="1200" height="390" rx="28" fill="#f7fbfc"/>

  <g stroke="#405162" stroke-width="4" marker-end="url(#arrow)" fill="none">
    <path d="M280 132 H375"/>
    <path d="M280 258 H375"/>
    <path d="M595 195 H690"/>
    <path d="M885 178 C914 108 926 92 952 88"/>
    <path d="M885 195 H952"/>
    <path d="M885 212 C914 282 926 302 952 306"/>
  </g>

  <g filter="url(#shadow)" font-family="sans-serif">
    <rect x="70" y="82" width="210" height="100" rx="18" fill="#006781"/>
    <rect x="70" y="208" width="210" height="100" rx="18" fill="#006781"/>
    <rect x="375" y="145" width="220" height="100" rx="18" fill="#298582"/>
    <rect x="690" y="145" width="195" height="100" rx="18" fill="#10263b"/>
    <rect x="952" y="52" width="190" height="74" rx="18" fill="#405162"/>
    <rect x="952" y="158" width="190" height="74" rx="18" fill="#405162"/>
    <rect x="952" y="264" width="190" height="74" rx="18" fill="#405162"/>
  </g>

  <g font-family="sans-serif" font-weight="700" fill="#ffffff" text-anchor="middle">
    <text x="175" y="126" font-size="16">Student and</text>
    <text x="175" y="148" font-size="16">teaching material</text>
    <text x="175" y="252" font-size="16">Research and</text>
    <text x="175" y="274" font-size="16">project material</text>
    <text x="485" y="189" font-size="16">External AI</text>
    <text x="485" y="211" font-size="16">service</text>
    <text x="787" y="189" font-size="16">Loss of</text>
    <text x="787" y="211" font-size="16">control</text>
    <text x="1047" y="94" font-size="16">Unclear retention</text>
    <text x="1047" y="190" font-size="16">Jurisdictional</text>
    <text x="1047" y="212" font-size="16">uncertainty</text>
    <text x="1047" y="296" font-size="16">Secondary use</text>
    <text x="1047" y="318" font-size="16">risk</text>
  </g>

  <g font-family="sans-serif" font-weight="700" fill="#405162" text-anchor="middle">
    <text x="485" y="51" font-size="14">risk increases when protected academic context leaves governed systems</text>
  </g>
</svg>
