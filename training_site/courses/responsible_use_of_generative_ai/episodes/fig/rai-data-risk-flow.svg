    <filter id="shadow" x="-10%" y="-20%" width="120%" height="145%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#10263b" flood-opacity="0.15"/></filter>
  </defs>
  <rect width="1200" height="380" rx="28" fill="#f7fbfc"/>
  <g stroke="#405162" stroke-width="4" marker-end="url(#arrow)" fill="none">
    <path d="M295 181 H375"/>
    <path d="M595 181 H700"/>
    <path d="M900 165 C920 105 925 92 940 91"/>
    <path d="M900 181 H940"/>
    <path d="M900 197 C920 257 925 291 940 291"/>
  </g><g filter="url(#shadow)" font-family="sans-serif">
    <rect x="75" y="135" width="220" height="92" rx="18" fill="#006781"/>
    <rect x="385" y="135" width="210" height="92" rx="18" fill="#298582"/>
    <rect x="710" y="135" width="190" height="92" rx="18" fill="#10263b"/>
    <rect x="950" y="55" width="190" height="72" rx="18" fill="#405162"/>
    <rect x="950" y="155" width="190" height="72" rx="18" fill="#405162"/>
    <rect x="950" y="255" width="190" height="72" rx="18" fill="#405162"/>
  </g><g font-family="sans-serif">
<text x="185.0" y="175.0" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Routine academic</text>
<text x="185.0" y="197.0" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">task</text>
<text x="490.0" y="175.0" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">External AI</text>
<text x="490.0" y="197.0" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">service</text>
<text x="805.0" y="186.0" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Loss of control</text>
<text x="1045.0" y="96.0" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Unclear retention</text>
<text x="1045.0" y="185.0" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Jurisdictional</text>
<text x="1045.0" y="207.0" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">uncertainty</text>
<text x="1045.0" y="285.0" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Secondary use</text>
<text x="1045.0" y="307.0" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">risk</text>
  </g>
</svg>
