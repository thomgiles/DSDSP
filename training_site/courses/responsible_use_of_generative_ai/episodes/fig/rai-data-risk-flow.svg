<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">AI service data risk flow</title>
  <desc id="desc">Routine tasks can become data-risk events when material leaves institutional control through an external AI service.</desc>
