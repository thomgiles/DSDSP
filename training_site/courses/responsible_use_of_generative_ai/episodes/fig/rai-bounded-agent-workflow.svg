<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">A bounded research agent workflow</title>
  <desc id="desc">Approved inputs enter an agent with limited tools. It produces a draft and run log, then stops for a human decision. Permission limits and stop conditions constrain the workflow.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#10263b" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#405162"/>
    </marker>
  </defs>
  <rect width="1200" height="520" rx="28" fill="#f7fbfc"/>

  <rect x="288" y="45" width="624" height="375" rx="34" fill="none" stroke="#009bc1" stroke-width="5" stroke-dasharray="12 10"/>
  <text x="600" y="78" font-family="sans-serif" font-size="17" font-weight="800" fill="#006781" text-anchor="middle">PERMISSION BOUNDARY</text>

  <g fill="none" stroke="#405162" stroke-width="5" marker-end="url(#arrow)">
    <path d="M260 225 H350"/><path d="M610 225 H700"/><path d="M920 225 H985"/>
  </g>

  <g font-family="sans-serif" text-anchor="middle" filter="url(#shadow)">
    <rect x="45" y="155" width="215" height="140" rx="24" fill="#006781"/>
    <rect x="350" y="130" width="260" height="190" rx="26" fill="#298582"/>
    <rect x="700" y="155" width="220" height="140" rx="24" fill="#405162"/>
    <path d="M1080 135 L1170 225 L1080 315 L990 225 Z" fill="#10263b"/>
    <rect x="320" y="360" width="320" height="100" rx="22" fill="#009bc1"/>
    <rect x="700" y="360" width="220" height="100" rx="22" fill="#006781"/>
  </g>

  <g font-family="sans-serif" text-anchor="middle" fill="#ffffff">
    <text x="152" y="198" font-size="20" font-weight="700">Approved inputs</text>
    <text x="152" y="230" font-size="16">known files · criteria</text>
    <text x="152" y="258" font-size="16">permitted sources</text>

    <text x="480" y="178" font-size="22" font-weight="800">AGENT</text>
    <text x="480" y="216" font-size="18" font-weight="700">limited tools and actions</text>
    <text x="480" y="247" font-size="16">retrieve · compare · draft</text>
    <text x="480" y="278" font-size="16">cannot publish or decide</text>

    <text x="810" y="198" font-size="20" font-weight="700">Draft output</text>
    <text x="810" y="230" font-size="16">uncertainty shown</text>
    <text x="810" y="258" font-size="16">no silent changes</text>

    <text x="1080" y="214" font-size="18" font-weight="700">Human</text>
    <text x="1080" y="238" font-size="18" font-weight="700">decision</text>

    <text x="480" y="398" font-size="18" font-weight="800">STOP CONDITIONS</text>
    <text x="480" y="425" font-size="15">failed source · unclear permission</text>
    <text x="480" y="447" font-size="15">limit reached · report incomplete work</text>

    <text x="810" y="398" font-size="18" font-weight="800">RUN LOG</text>
    <text x="810" y="430" font-size="15">steps · errors · checks</text>
  </g>
</svg>
