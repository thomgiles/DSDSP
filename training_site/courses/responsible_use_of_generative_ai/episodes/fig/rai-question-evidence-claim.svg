<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Match the research question, evidence, and claim</title>
  <desc id="desc">Questions about experience, change, and effect need different evidence and support different claims.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#10263b" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#405162"/>
    </marker>
  </defs>
  <rect width="1200" height="520" rx="28" fill="#f7fbfc"/>

  <g font-family="sans-serif" text-anchor="middle" font-size="16" font-weight="800" fill="#405162">
    <text x="190" y="52">QUESTION ASKS ABOUT</text>
    <text x="600" y="52">EVIDENCE COULD BE</text>
    <text x="1010" y="52">CLAIM CAN DESCRIBE</text>
  </g>

  <g fill="none" stroke="#405162" stroke-width="4.5" marker-end="url(#arrow)">
    <path d="M340 135 H438"/><path d="M760 135 H858"/>
    <path d="M340 275 H438"/><path d="M760 275 H858"/>
    <path d="M340 415 H438"/><path d="M760 415 H858"/>
  </g>

  <g font-family="sans-serif" text-anchor="middle" filter="url(#shadow)">
    <rect x="55" y="82" width="285" height="106" rx="22" fill="#006781"/>
    <rect x="440" y="82" width="320" height="106" rx="22" fill="#298582"/>
    <rect x="860" y="82" width="285" height="106" rx="22" fill="#405162"/>

    <rect x="55" y="222" width="285" height="106" rx="22" fill="#006781"/>
    <rect x="440" y="222" width="320" height="106" rx="22" fill="#298582"/>
    <rect x="860" y="222" width="285" height="106" rx="22" fill="#405162"/>

    <rect x="55" y="362" width="285" height="106" rx="22" fill="#006781"/>
    <rect x="440" y="362" width="320" height="106" rx="22" fill="#298582"/>
    <rect x="860" y="362" width="285" height="106" rx="22" fill="#10263b"/>
  </g>

  <g font-family="sans-serif" text-anchor="middle" fill="#ffffff">
    <text x="197" y="125" font-size="22" font-weight="700">Experience</text>
    <text x="197" y="155" font-size="16">What was it like?</text>
    <text x="600" y="125" font-size="20" font-weight="700">Interviews or observations</text>
    <text x="600" y="155" font-size="16">from a varied sample</text>
    <text x="1002" y="125" font-size="20" font-weight="700">Reported experiences</text>
    <text x="1002" y="155" font-size="16">not an effect</text>

    <text x="197" y="265" font-size="22" font-weight="700">Change</text>
    <text x="197" y="295" font-size="16">What changed over time?</text>
    <text x="600" y="265" font-size="20" font-weight="700">Repeated measurements</text>
    <text x="600" y="295" font-size="16">from the same people</text>
    <text x="1002" y="265" font-size="20" font-weight="700">Observed change</text>
    <text x="1002" y="295" font-size="16">not what caused it</text>

    <text x="197" y="405" font-size="22" font-weight="700">Effect</text>
    <text x="197" y="435" font-size="16">Did this cause a difference?</text>
    <text x="600" y="405" font-size="20" font-weight="700">A suitable comparison</text>
    <text x="600" y="435" font-size="16">with assumptions checked</text>
    <text x="1002" y="405" font-size="20" font-weight="700">An estimated effect</text>
    <text x="1002" y="435" font-size="16">with uncertainty</text>
  </g>
</svg>
