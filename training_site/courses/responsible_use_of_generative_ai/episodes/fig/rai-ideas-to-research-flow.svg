<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">From ideas to research design</title>
  <desc id="desc">A six-stage reasoning flow moves from an observation to a possible explanation, alternative explanations, a prediction, evidence, and finally a research design.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#10263b" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#405162"/>
    </marker>
  </defs>

  <rect width="1200" height="400" rx="28" fill="#f7fbfc"/>

  <g fill="none" stroke="#405162" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M195 190 H220"/>
    <path d="M390 190 H415"/>
    <path d="M585 190 H610"/>
    <path d="M780 190 H805"/>
    <path d="M975 190 H1000"/>
  </g>

  <g font-family="sans-serif" filter="url(#shadow)">
    <rect x="35" y="105" width="160" height="170" rx="23" fill="#006781"/>
    <rect x="230" y="105" width="160" height="170" rx="23" fill="#298582"/>
    <rect x="425" y="105" width="160" height="170" rx="23" fill="#405162"/>
    <rect x="620" y="105" width="160" height="170" rx="23" fill="#298582"/>
    <rect x="815" y="105" width="160" height="170" rx="23" fill="#006781"/>
    <rect x="1010" y="105" width="155" height="170" rx="23" fill="#10263b"/>
  </g>

  <g font-family="sans-serif" text-anchor="middle" fill="#ffffff">
    <text x="115" y="151" font-size="16" font-weight="800">1</text>
    <text x="115" y="192" font-size="19" font-weight="700">Observation</text>
    <text x="115" y="224" font-size="14">What did we notice?</text>

    <text x="310" y="151" font-size="16" font-weight="800">2</text>
    <text x="310" y="192" font-size="19" font-weight="700">Explanation</text>
    <text x="310" y="224" font-size="14">What might explain it?</text>

    <text x="505" y="151" font-size="16" font-weight="800">3</text>
    <text x="505" y="192" font-size="19" font-weight="700">Alternatives</text>
    <text x="505" y="218" font-size="14">What else could</text>
    <text x="505" y="238" font-size="14">explain it?</text>

    <text x="700" y="151" font-size="16" font-weight="800">4</text>
    <text x="700" y="192" font-size="19" font-weight="700">Prediction</text>
    <text x="700" y="224" font-size="14">What should follow?</text>

    <text x="895" y="151" font-size="16" font-weight="800">5</text>
    <text x="895" y="192" font-size="19" font-weight="700">Evidence</text>
    <text x="895" y="218" font-size="14">What supports or</text>
    <text x="895" y="238" font-size="14">challenges it?</text>

    <text x="1087" y="151" font-size="16" font-weight="800">6</text>
    <text x="1087" y="186" font-size="18" font-weight="700">Research</text>
    <text x="1087" y="209" font-size="18" font-weight="700">design</text>
    <text x="1087" y="239" font-size="14">How will we test it?</text>
  </g>
</svg>
