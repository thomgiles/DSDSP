<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Prompt context and generation loop</title>
  <desc id="desc">A prompt enters the model, attention is computed, tokens are emitted, and the context is updated during generation.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2 2 L10 6 L2 10 Z" fill="#405162"/></marker>
    <marker id="arrow-light" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2 2 L10 6 L2 10 Z" fill="#009bc1"/></marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="145%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#10263b" flood-opacity="0.15"/></filter>
  </defs>
  <rect width="1200" height="330" rx="28" fill="#f7fbfc"/>
  <g filter="url(#shadow)" font-family="sans-serif">
    <rect x="170" y="45" width="220" height="72" rx="18" fill="#006781"/>
    <rect x="780" y="45" width="220" height="72" rx="18" fill="#298582"/>
  </g>
  <g stroke="#405162" stroke-width="2.5" stroke-dasharray="7 8" fill="none">
    <path d="M280 122 V292"/>
    <path d="M890 122 V292"/>
  </g>
  <g stroke="#405162" stroke-width="4" marker-end="url(#arrow)" fill="none">
    <path d="M280 152 H890"/>
    <path d="M890 195 C970 195 970 226 890 226"/>
    <path d="M890 254 H280"/>
    <path d="M890 286 C970 286 970 318 890 318" stroke="#009bc1" marker-end="url(#arrow-light)"/>
  </g><g font-family="sans-serif">
<text x="280" y="88.0" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">Prompt</text>
<text x="890" y="88.0" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">LLM</text>
    <rect x="473" y="122" width="224" height="28" rx="14" fill="#ffffff" fill-opacity="0.92"/>
<text x="585" y="142.0" font-size="13" font-weight="700" fill="#10263b" text-anchor="middle">Provide prompt</text>
    <rect x="898" y="194" width="224" height="28" rx="14" fill="#ffffff" fill-opacity="0.92"/>
<text x="1010" y="214.0" font-size="13" font-weight="700" fill="#10263b" text-anchor="middle">Compute attention</text>
    <rect x="473" y="224" width="224" height="28" rx="14" fill="#ffffff" fill-opacity="0.92"/>
<text x="585" y="244.0" font-size="13" font-weight="700" fill="#10263b" text-anchor="middle">Output token</text>
    <rect x="898" y="284" width="224" height="28" rx="14" fill="#ffffff" fill-opacity="0.92"/>
<text x="1010" y="304.0" font-size="13" font-weight="700" fill="#10263b" text-anchor="middle">Update context</text>
  </g>
</svg>
