<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Research identity network</title>
  <desc id="desc">An ORCID iD links a researcher to publications, institutional systems, repositories, and funders.</desc>
  <defs>
    <marker id="arrow" markerWidth="13" markerHeight="13" refX="10" refY="6.5" orient="auto">
      <path d="M2 2 L10 6.5 L2 11 Z" fill="#405162"/>
    </marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="145%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#10263b" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="1200" height="360" rx="28" fill="#f7fbfc"/>

  <g>
<path d="M600 180 L600 68" stroke="#405162" stroke-width="3.5" fill="none"/>
<path d="M600 180 L930 180" stroke="#405162" stroke-width="3.5" fill="none"/>
<path d="M600 180 L600 292" stroke="#405162" stroke-width="3.5" fill="none"/>
<path d="M600 180 L270 180" stroke="#405162" stroke-width="3.5" fill="none"/>
  </g>
  <g filter="url(#shadow)" font-family="sans-serif">
    <circle cx="600" cy="180" r="60" fill="#10263b"/>
<text x="600" y="187.0" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">ORCID iD</text>
    <rect x="490.0" y="33.0" width="220" height="70" rx="18" fill="#006781"/>
<text x="600.0" y="75.0" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">Publications</text>
    <rect x="805.0" y="141.0" width="250" height="78" rx="18" fill="#298582"/>
<text x="930.0" y="176.0" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">Repositories &amp;</text>
<text x="930.0" y="198.0" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">Funders</text>
    <rect x="485.0" y="254.0" width="230" height="76" rx="18" fill="#405162"/>
<text x="600.0" y="288.0" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">Institutional</text>
<text x="600.0" y="310.0" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">Systems</text>
    <rect x="165.0" y="145.0" width="210" height="70" rx="18" fill="#009bc1"/>
<text x="270.0" y="187.0" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">Researcher</text>
  </g>
</svg>
