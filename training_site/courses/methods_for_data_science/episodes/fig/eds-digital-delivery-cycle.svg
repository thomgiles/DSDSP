<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Digital delivery cycle</title>
  <desc id="desc">A donut cycle showing digital delivery as plan, build, share, and learn around a reusable output.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#10263b" flood-opacity="0.16"/>
    </filter>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#10263b" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1200" height="360" rx="28" fill="#f7fbfc"/>

  <g font-family="sans-serif" text-anchor="middle">
    <g filter="url(#shadow)">
      <circle cx="600" cy="180" r="108" fill="#e5eef2"/>
      <path d="M600 80 C655 80 700 125 700 180 L664 180 C664 145 635 116 600 116 Z" fill="#006781"/>
      <path d="M700 180 C700 235 655 280 600 280 L600 244 C635 244 664 215 664 180 Z" fill="#009bc1"/>
      <path d="M600 280 C545 280 500 235 500 180 L536 180 C536 215 565 244 600 244 Z" fill="#298582"/>
      <path d="M500 180 C500 125 545 80 600 80 L600 116 C565 116 536 145 536 180 Z" fill="#405162"/>
      <circle cx="600" cy="180" r="66" fill="#ffffff"/>
      <circle cx="600" cy="180" r="54" fill="#10263b"/>
      <text x="600" y="175" font-size="15" font-weight="800" fill="#ffffff">Reusable</text>
      <text x="600" y="197" font-size="15" font-weight="800" fill="#ffffff">Output</text>
    </g>

    <g filter="url(#soft-shadow)" font-size="17" font-weight="800">
      <rect x="500" y="18" width="200" height="58" rx="18" fill="#006781"/>
      <text x="600" y="54" fill="#ffffff">Plan</text>

      <rect x="805" y="151" width="200" height="58" rx="18" fill="#009bc1"/>
      <text x="905" y="187" fill="#ffffff">Build</text>

      <rect x="500" y="284" width="200" height="58" rx="18" fill="#298582"/>
      <text x="600" y="320" fill="#ffffff">Share</text>

      <rect x="195" y="151" width="200" height="58" rx="18" fill="#405162"/>
      <text x="295" y="187" fill="#ffffff">Learn</text>
    </g>

    <g fill="none" stroke="#b8cbd4" stroke-width="2.5" stroke-linecap="round">
      <path d="M600 93 C600 112 600 121 600 134"/>
      <path d="M777 180 C756 180 743 180 728 180"/>
      <path d="M600 267 C600 248 600 239 600 226"/>
      <path d="M423 180 C444 180 457 180 472 180"/>
    </g>
  </g>
</svg>
