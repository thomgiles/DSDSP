<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="248" viewBox="0 0 1200 248" role="img" aria-labelledby="title desc">
  <title id="title">Data lifecycle model</title>
  <desc id="desc">Research data moves from planning and collection through processing, storage, sharing, preservation, and reuse.</desc>
  <defs>
    <marker id="arrow" markerWidth="13" markerHeight="13" refX="10" refY="6.5" orient="auto">
      <path d="M2 2 L10 6.5 L2 11 Z" fill="#405162"/>
    </marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="145%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#10263b" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="1200" height="248" rx="28" fill="#f7fbfc"/>

  <g stroke="none" filter="url(#shadow)" font-family="sans-serif">
    <rect x="60.0" y="76" width="145" height="102" rx="18" fill="#006781"/>
<text x="132.5" y="122.5" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Plan &amp;</text>
<text x="132.5" y="143.5" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Design</text>
    <rect x="293.8" y="76" width="145" height="102" rx="18" fill="#298582"/>
<text x="366.3" y="133.0" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">Collect</text>
    <rect x="527.5" y="76" width="145" height="102" rx="18" fill="#405162"/>
<text x="600.0" y="122.5" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Process &amp;</text>
<text x="600.0" y="143.5" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Analyse</text>
    <rect x="761.2" y="76" width="145" height="102" rx="18" fill="#009bc1"/>
<text x="833.7" y="122.5" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Store &amp;</text>
<text x="833.7" y="143.5" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Share</text>
    <rect x="995.0" y="76" width="145" height="102" rx="18" fill="#10263b"/>
<text x="1067.5" y="122.5" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Preserve &amp;</text>
<text x="1067.5" y="143.5" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Reuse</text>
  </g>
  <g>
<path d="M221.0 127.0 H271.8" stroke="#405162" stroke-width="4.5" marker-end="url(#arrow)" fill="none"/>
<path d="M454.8 127.0 H505.5" stroke="#405162" stroke-width="4.5" marker-end="url(#arrow)" fill="none"/>
<path d="M688.5 127.0 H739.2" stroke="#405162" stroke-width="4.5" marker-end="url(#arrow)" fill="none"/>
<path d="M922.2 127.0 H973.0" stroke="#405162" stroke-width="4.5" marker-end="url(#arrow)" fill="none"/>
  </g>
</svg>
