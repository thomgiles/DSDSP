<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Research sprint cycle</title>
  <desc id="desc">A donut chart showing planning, execution, review, and retrospective as the four stages of a research sprint.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="145%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#10263b" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="28" fill="#f7fbfc"/>

  <g filter="url(#shadow)">
    <path d="M613.1 30.6 A150 150 0 0 1 749.4 166.9 L675.7 173.4 A76 76 0 0 0 606.6 104.3 Z" fill="#006781"/>
    <path d="M749.4 193.1 A150 150 0 0 1 613.1 329.4 L606.6 255.7 A76 76 0 0 0 675.7 186.6 Z" fill="#298582"/>
    <path d="M586.9 329.4 A150 150 0 0 1 450.6 193.1 L524.3 186.6 A76 76 0 0 0 593.4 255.7 Z" fill="#405162"/>
    <path d="M450.6 166.9 A150 150 0 0 1 586.9 30.6 L593.4 104.3 A76 76 0 0 0 524.3 173.4 Z" fill="#009bc1"/>
  </g>
  <g font-family="sans-serif" fill="#ffffff" text-anchor="middle">

    <text x="681.3" y="98.7" font-size="15" font-weight="800">Planning</text>
    <text x="681.3" y="261.3" font-size="15" font-weight="800">Execution</text>
    <text x="518.7" y="261.3" font-size="15" font-weight="800">Review</text>
    <text x="518.7" y="88.7" font-size="15" font-weight="800">Retro-</text>
    <text x="518.7" y="108.7" font-size="15" font-weight="800">spective</text>
  </g>
  <g font-family="sans-serif" text-anchor="middle">
    <circle cx="600" cy="180" r="64" fill="#10263b"/>
    <text x="600" y="174" font-size="17" font-weight="800" fill="#ffffff">Research</text>
    <text x="600" y="198" font-size="17" font-weight="800" fill="#ffffff">Sprint</text>
  </g>
</svg>
