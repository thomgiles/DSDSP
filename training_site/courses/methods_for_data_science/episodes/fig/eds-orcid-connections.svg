<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">ORCID connections</title>
  <desc id="desc">A researcher connects to funders, publishers, and repositories through an ORCID iD.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#405162"/>
    </marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="145%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#10263b" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="1200" height="340" rx="28" fill="#f7fbfc"/>
  <g stroke="#405162" stroke-width="4" marker-end="url(#arrow)" fill="none">
    <path d="M600.0 170.0 Q405.0 117.0 210.0 100.0"/>
    <path d="M600.0 170.0 Q795.0 117.0 990.0 100.0"/>
    <path d="M600.0 170.0 Q795.0 197.0 990.0 260.0"/>
    <path d="M600.0 170.0 Q405.0 197.0 210.0 260.0"/>
  </g>
  <g filter="url(#shadow)" font-family="sans-serif">
    <rect x="485.0" y="108.0" width="230" height="124" rx="24" fill="#10263b"/>
    <rect x="95.0" y="52.0" width="230" height="96" rx="20" fill="#006781"/>
    <rect x="875.0" y="52.0" width="230" height="96" rx="20" fill="#298582"/>
    <rect x="875.0" y="212.0" width="230" height="96" rx="20" fill="#405162"/>
    <rect x="95.0" y="212.0" width="230" height="96" rx="20" fill="#009bc1"/>
  </g>
  <g font-family="sans-serif">
<text x="600.0" y="177.0" font-size="21" font-weight="700" fill="#ffffff" text-anchor="middle">ORCID iD</text>
<text x="210" y="106.0" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Researcher</text>
<text x="990" y="106.0" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Funders</text>
<text x="990" y="266.0" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Publishers</text>
<text x="210" y="266.0" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Repositories</text>
  </g>
</svg>
