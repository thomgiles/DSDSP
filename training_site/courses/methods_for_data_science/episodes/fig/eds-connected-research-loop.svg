<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Connected research loop</title>
  <desc id="desc">Connected research balances transparency, trust, collaboration, and impact.</desc>
  <defs>
    <marker id="arrow" markerWidth="13" markerHeight="13" refX="10" refY="6.5" orient="auto">
      <path d="M2 2 L10 6.5 L2 11 Z" fill="#405162"/>
    </marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="145%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#10263b" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="1200" height="360" rx="28" fill="#f7fbfc"/>

  <g>
<path d="M600 180 L600 70" stroke="#405162" stroke-width="3.5" fill="none"/>
<path d="M600 180 L930 180" stroke="#405162" stroke-width="3.5" fill="none"/>
<path d="M600 180 L600 290" stroke="#405162" stroke-width="3.5" fill="none"/>
<path d="M600 180 L270 180" stroke="#405162" stroke-width="3.5" fill="none"/>
  </g>
  <g filter="url(#shadow)" font-family="sans-serif">
    <circle cx="600" cy="180" r="62" fill="#10263b"/>
<text x="600" y="176.0" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">Connected</text>
<text x="600" y="198.0" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">Research</text>
    <rect x="490.0" y="35.0" width="220" height="70" rx="18" fill="#006781"/>
<text x="600.0" y="77.0" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">Transparency</text>
    <rect x="825.0" y="145.0" width="210" height="70" rx="18" fill="#298582"/>
<text x="930.0" y="187.0" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">Trust</text>
    <rect x="485.0" y="255.0" width="230" height="70" rx="18" fill="#405162"/>
<text x="600.0" y="297.0" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">Collaboration</text>
    <rect x="165.0" y="145.0" width="210" height="70" rx="18" fill="#009bc1"/>
<text x="270.0" y="187.0" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">Impact</text>
  </g>
</svg>
