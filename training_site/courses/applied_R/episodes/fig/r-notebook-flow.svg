<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="285" viewBox="0 0 1200 285" role="img" aria-labelledby="title desc">
  <title id="title">A computational notebook</title>
  <desc id="desc">Sources and saved code are executed to create inspectable tables, figures and narrative.</desc>
  <rect width="1200" height="285" rx="28" fill="#f7fbfc" />
  <g font-family="sans-serif" text-anchor="middle">
    <text x="600" y="42" font-size="27" font-weight="700" fill="#10263b">A computational notebook</text>
    <rect x="36" y="78" width="258" height="142" rx="18" fill="#006781" />
    <text x="165" y="119" font-size="27" font-weight="700" fill="white">Source and code</text>
    <text x="165" y="158" font-size="23" fill="white">Retain inputs</text>
    <text x="165" y="187" font-size="23" fill="white">and instructions</text>
    <path d="M294 149 H313 L308 143 M313 149 L308 155" fill="none" stroke="#405162" stroke-width="3" />
    <rect x="326" y="78" width="258" height="142" rx="18" fill="#298582" />
    <text x="455" y="119" font-size="27" font-weight="700" fill="white">Execute</text>
    <text x="455" y="158" font-size="23" fill="white">Run from a</text>
    <text x="455" y="187" font-size="23" fill="white">fresh session</text>
    <path d="M584 149 H603 L598 143 M603 149 L598 155" fill="none" stroke="#405162" stroke-width="3" />
    <rect x="616" y="78" width="258" height="142" rx="18" fill="#405162" />
    <text x="745" y="119" font-size="27" font-weight="700" fill="white">Inspect</text>
    <text x="745" y="158" font-size="23" fill="white">Check outputs</text>
    <text x="745" y="187" font-size="23" fill="white">and narrative</text>
    <path d="M874 149 H893 L888 143 M893 149 L888 155" fill="none" stroke="#405162" stroke-width="3" />
    <rect x="906" y="78" width="258" height="142" rx="18" fill="#10263b" />
    <text x="1035" y="119" font-size="27" font-weight="700" fill="white">Share</text>
    <text x="1035" y="158" font-size="23" fill="white">A report and</text>
    <text x="1035" y="187" font-size="23" fill="white">its source files</text>
    <text x="600" y="260" font-size="23" fill="#405162">Keep the source, checking decisions and limitations with the output.</text>
  </g>
</svg>
