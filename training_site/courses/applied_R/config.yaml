#------------------------------------------------------------
# Retained Carpentries metadata for the local Applied R course.
# Quarto navigation is defined in training_site/_quarto.yml; this ordered list
# mirrors the four current sessions and excludes the compatibility-only page.
#------------------------------------------------------------

# Which carpentry is this (swc, dc, lc, or cp)?
# swc: Software Carpentry
# dc: Data Carpentry
# lc: Library Carpentry
# cp: Carpentries (to use for instructor training for instance)
# incubator: The Carpentries Incubator
carpentry: 'swc'

# Overall title for pages.
title: 'Applied R'

# Date the lesson was created (YYYY-MM-DD, this is empty by default)
created: '2014-12-18'

# Comma-separated list of keywords for the lesson
keywords: 'R, RStudio, research, data analysis, tidyverse, ggplot2, reproducibility'

# Life cycle stage of the lesson
# possible values: pre-alpha, alpha, beta, stable
life_cycle: 'stable'

# License of the lesson materials (recommended CC-BY 4.0)
license: 'CC-BY 4.0'

# Upstream source repository retained for attribution
source: 'https://github.com/swcarpentry/r-novice-inflammation'

# Default branch of your lesson
branch: 'main'

# Who to contact if there are any issues
contact: 'digitalresearch@nottingham.ac.uk'

# Navigation ------------------------------------------------
#
# Use the following menu items to specify the order of
# individual pages in each dropdown section. Leave blank to
# include all pages in the folder.
#
# Example -------------
#
# episodes:
# - introduction.md
# - first-steps.md
#
# learners:
# - setup.md
#
# instructors:
# - instructor-notes.md
#
# profiles:
# - one-learner.md
# - another-learner.md

# Order of episodes in your lesson
episodes:
- 01-Rstudio_intro.qmd
- 03-R_functions.qmd
- 04-for_loops.qmd
- 05-the_tidyverse.qmd

# Information for Learners
learners:
- setup.qmd
- additional_material.qmd
- reference.qmd
- discuss.qmd

# Information for Instructors
instructors:
- instructor-notes.qmd
- additional_material.qmd
- extra_exercises.qmd

# Learner Profiles
profiles:
- learner-profiles.qmd

# Customisation ---------------------------------------------
#
# This space below is where custom yaml items (e.g. pinning
# sandpaper and varnish versions) should live


# Upstream website retained for attribution; local pages are served by Quarto.
url: 'https://swcarpentry.github.io/r-novice-inflammation'
lang: en
