<text x="385.0" y="102.0" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Findable</text>
    <rect x="790" y="55" width="230" height="80" rx="24" fill="#298582"/>
<text x="905.0" y="102.0" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Accessible</text>
    <rect x="270" y="245" width="230" height="80" rx="24" fill="#405162"/>
<text x="385.0" y="292.0" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Reusable</text>
