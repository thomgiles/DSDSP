<text x="600.0" y="61.0" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">Trust &amp;</text>
<text x="600.0" y="83.0" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">Compliance</text>
