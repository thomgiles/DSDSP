<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">A connected literature discovery and citation workflow</title>
  <desc id="desc">Find literature and follow citation trails, check reference details against the source, organise reading notes with references, then cite sources and check the bibliography. The return arrow shows how new questions lead back to searching.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1 1 L8 5 L1 9 Z" fill="#405162"/>
    </marker>
  </defs>
  <rect width="1200" height="280" rx="28" fill="#f7fbfc"/>
  <g font-family="sans-serif" text-anchor="middle">
    <g fill="none" stroke="#405162" stroke-width="3" marker-end="url(#arrow)">
      <path d="M294 154 H319"/>
      <path d="M584 154 H609"/>
      <path d="M874 154 H899"/>
      <path d="M1035 222 V258 H165 V228"/>
    </g>
    <rect x="36" y="88" width="258" height="134" rx="18" fill="#006781"/>
    <rect x="326" y="88" width="258" height="134" rx="18" fill="#298582"/>
    <rect x="616" y="88" width="258" height="134" rx="18" fill="#405162"/>
    <rect x="906" y="88" width="258" height="134" rx="18" fill="#10263b"/>
    <g fill="#ffffff">
      <text x="165" y="128" font-size="29" font-weight="700">Find</text>
      <text x="165" y="168" font-size="23">Search and follow</text>
      <text x="165" y="197" font-size="23">citation trails</text>
      <text x="455" y="128" font-size="29" font-weight="700">Check</text>
      <text x="455" y="168" font-size="23">Compare the record</text>
      <text x="455" y="197" font-size="23">with its source</text>
      <text x="745" y="128" font-size="26" font-weight="700">Read and organise</text>
      <text x="745" y="168" font-size="23">Keep notes linked</text>
      <text x="745" y="197" font-size="23">to the reference</text>
      <text x="1035" y="128" font-size="29" font-weight="700">Cite</text>
      <text x="1035" y="168" font-size="23">Support the claim;</text>
      <text x="1035" y="197" font-size="23">check the bibliography</text>
    </g>
  </g>
</svg>
