<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="235" viewBox="0 0 1200 235" role="img" aria-labelledby="title desc">
  <title id="title">MFA access flow</title>
  <desc id="desc">User login moves through password and second factor checks before access is granted.</desc>
  <defs>
    <marker id="arrow" markerWidth="13" markerHeight="13" refX="10" refY="6.5" orient="auto">
      <path d="M2 2 L10 6.5 L2 11 Z" fill="#405162"/>
    </marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="145%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#10263b" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="1200" height="235" rx="28" fill="#f7fbfc"/>

  <g stroke="none" filter="url(#shadow)" font-family="sans-serif">
    <rect x="55.0" y="76" width="215" height="100" rx="18" fill="#006781"/>
<text x="162.5" y="133.0" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">User Login</text>
    <rect x="346.7" y="76" width="215" height="100" rx="18" fill="#298582"/>
<text x="454.2" y="133.0" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">Password</text>
    <rect x="638.3" y="76" width="215" height="100" rx="18" fill="#405162"/>
<text x="745.8" y="133.0" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">Second Factor</text>
    <rect x="930.0" y="76" width="215" height="100" rx="18" fill="#009bc1"/>
<text x="1037.5" y="133.0" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">Access Granted</text>
  </g>
  <g>
<path d="M285.0 126.0 H328.7" stroke="#405162" stroke-width="4.5" marker-end="url(#arrow)" fill="none"/>
<path d="M576.7 126.0 H620.3" stroke="#405162" stroke-width="4.5" marker-end="url(#arrow)" fill="none"/>
<path d="M868.3 126.0 H912.0" stroke="#405162" stroke-width="4.5" marker-end="url(#arrow)" fill="none"/>
  </g>
</svg>
