<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Institutional research ecosystem</title>
  <desc id="desc">A hub-and-spoke ecosystem connecting research work with people, institutional systems, and collaborative outputs.</desc>
  <defs>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#10263b" flood-opacity="0.15"/>
    </filter>
    <filter id="node-shadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#10263b" flood-opacity="0.13"/>
    </filter>
  </defs>
  <rect width="1200" height="360" rx="28" fill="#f7fbfc"/>

  <g fill="none" stroke-linecap="round">
    <ellipse cx="600" cy="180" rx="360" ry="112" stroke="#d7e7ed" stroke-width="4"/>
    <ellipse cx="600" cy="180" rx="252" ry="78" stroke="#e5eef2" stroke-width="3"/>
    <path d="M408 108 C492 54 708 54 792 108" stroke="#009bc1" stroke-width="5"/>
    <path d="M840 151 C920 170 920 238 790 263" stroke="#298582" stroke-width="5"/>
    <path d="M408 252 C492 306 708 306 792 252" stroke="#405162" stroke-width="5"/>
    <path d="M360 151 C280 170 280 238 410 263" stroke="#006781" stroke-width="5"/>
  </g>

  <g font-family="sans-serif" text-anchor="middle">
    <g stroke="#bfd3dc" stroke-width="3" stroke-linecap="round">
      <line x1="600" y1="180" x2="398" y2="104"/>
      <line x1="600" y1="180" x2="802" y2="104"/>
      <line x1="600" y1="180" x2="840" y2="180"/>
      <line x1="600" y1="180" x2="802" y2="256"/>
      <line x1="600" y1="180" x2="398" y2="256"/>
      <line x1="600" y1="180" x2="360" y2="180"/>
    </g>

    <g filter="url(#shadow)">
      <circle cx="600" cy="180" r="68" fill="#10263b"/>
      <text x="600" y="176" font-size="16" font-weight="800" fill="#ffffff">Research</text>
      <text x="600" y="199" font-size="16" font-weight="800" fill="#ffffff">Work</text>
    </g>

    <g filter="url(#node-shadow)" font-size="15" font-weight="800">
      <g>
        <rect x="286" y="72" width="224" height="64" rx="18" fill="#006781"/>
        <text x="398" y="111" fill="#ffffff">Researchers</text>
      </g>
      <g>
        <rect x="690" y="72" width="224" height="64" rx="18" fill="#009bc1"/>
        <text x="802" y="100" fill="#ffffff">Collaboration</text>
        <text x="802" y="121" fill="#ffffff">Spaces</text>
      </g>
      <g>
        <rect x="760" y="148" width="224" height="64" rx="18" fill="#298582"/>
        <text x="872" y="176" fill="#ffffff">Institutional</text>
        <text x="872" y="197" fill="#ffffff">Systems</text>
      </g>
      <g>
        <rect x="690" y="224" width="224" height="64" rx="18" fill="#405162"/>
        <text x="802" y="252" fill="#ffffff">Collaborative</text>
        <text x="802" y="273" fill="#ffffff">Outputs</text>
      </g>
      <g>
        <rect x="286" y="224" width="224" height="64" rx="18" fill="#298582"/>
        <text x="398" y="252" fill="#ffffff">Data And</text>
        <text x="398" y="273" fill="#ffffff">Evidence</text>
      </g>
      <g>
        <rect x="216" y="148" width="224" height="64" rx="18" fill="#009bc1"/>
        <text x="328" y="176" fill="#ffffff">Administration</text>
        <text x="328" y="197" fill="#ffffff">And Governance</text>
      </g>
    </g>
  </g>
</svg>
