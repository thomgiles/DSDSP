<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">UniCore operations map</title>
  <desc id="desc">UniCore sits at the centre of operational processes such as purchasing, expenses, leave, and research operations.</desc>
  <defs>
    <marker id="arrow" markerWidth="13" markerHeight="13" refX="10" refY="6.5" orient="auto">
      <path d="M2 2 L10 6.5 L2 11 Z" fill="#405162"/>
    </marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="145%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#10263b" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="1200" height="360" rx="28" fill="#f7fbfc"/>

  <g>
<path d="M600 180 L600 70" stroke="#405162" stroke-width="3.5" fill="none"/>
<path d="M600 180 L900 180" stroke="#405162" stroke-width="3.5" fill="none"/>
<path d="M600 180 L600 290" stroke="#405162" stroke-width="3.5" fill="none"/>
<path d="M600 180 L300 180" stroke="#405162" stroke-width="3.5" fill="none"/>
  </g>
  <g filter="url(#shadow)" font-family="sans-serif">
    <circle cx="600" cy="180" r="54" fill="#10263b"/>
<text x="600" y="187.0" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">UniCore</text>
    <rect x="490.0" y="35.0" width="220" height="70" rx="18" fill="#006781"/>
<text x="600.0" y="77.0" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">Purchasing</text>
    <rect x="790.0" y="145.0" width="220" height="70" rx="18" fill="#298582"/>
<text x="900.0" y="187.0" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">Expenses</text>
    <rect x="480.0" y="251.0" width="240" height="78" rx="18" fill="#405162"/>
<text x="600.0" y="286.0" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">HR &amp; Leave</text>
<text x="600.0" y="308.0" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">Management</text>
    <rect x="190.0" y="141.0" width="220" height="78" rx="18" fill="#009bc1"/>
<text x="300.0" y="176.0" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">Research</text>
<text x="300.0" y="198.0" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">Operations</text>
  </g>
</svg>
