<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">RDM role and responsibility map</title>
  <desc id="desc">Research data management roles are grouped with their responsibilities in a left-to-right sequence of forward-flow cards.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="145%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#10263b" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="28" fill="#f7fbfc"/>

  <g filter="url(#shadow)" font-family="sans-serif">
