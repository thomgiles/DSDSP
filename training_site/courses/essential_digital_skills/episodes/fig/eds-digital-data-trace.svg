<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Digital data trace sequence</title>
  <desc id="desc">A person interacts with a digital system, which creates a trace in a data store that can be accessed or interpreted by third parties.</desc>
  <defs>
    <marker id="arrow" markerWidth="13" markerHeight="13" refX="10" refY="6.5" orient="auto">
      <path d="M2 2 L10 6.5 L2 11 Z" fill="#405162"/>
    </marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="145%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#10263b" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="1200" height="390" rx="28" fill="#f7fbfc"/>

  <g filter="url(#shadow)" font-family="sans-serif">
    <rect x="88" y="42" width="184" height="70" rx="18" fill="#006781"/>
<text x="180.0" y="84.0" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">User</text>
    <rect x="368" y="42" width="184" height="70" rx="18" fill="#298582"/>
<text x="460.0" y="84.0" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Digital System</text>
    <rect x="648" y="42" width="184" height="70" rx="18" fill="#405162"/>
<text x="740.0" y="84.0" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Data Store</text>
    <rect x="928" y="42" width="184" height="70" rx="18" fill="#009bc1"/>
<text x="1020.0" y="84.0" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Third Parties</text>
  </g>
  <g stroke="#405162" stroke-width="2.5" stroke-dasharray="7 8" fill="none">
    <path d="M180 122 V350"/>
    <path d="M460 122 V350"/>
    <path d="M740 122 V350"/>
    <path d="M1020 122 V350"/>
  </g>
  <g>
<path d="M180 170 H460" stroke="#405162" stroke-width="4" marker-end="url(#arrow)" fill="none"/>
<path d="M460 230 H740" stroke="#405162" stroke-width="4" marker-end="url(#arrow)" fill="none"/>
<path d="M740 290 H1020" stroke="#405162" stroke-width="4" marker-end="url(#arrow)" fill="none"/>
<path d="M1020 340 H740" stroke="#405162" stroke-width="4" marker-end="url(#arrow)" fill="none"/>
  </g>
  <g font-family="sans-serif">
    <rect x="185.0" y="128" width="270" height="42" rx="14" fill="#ffffff" fill-opacity="0.94"/>
<text x="320" y="145.0" font-size="13" font-weight="700" fill="#10263b" text-anchor="middle">Interact with device /</text>
<text x="320" y="163.0" font-size="13" font-weight="700" fill="#10263b" text-anchor="middle">internet</text>
    <rect x="475.0" y="190" width="250" height="34" rx="14" fill="#ffffff" fill-opacity="0.94"/>
<text x="600" y="212.0" font-size="13" font-weight="700" fill="#10263b" text-anchor="middle">Generate digital trace</text>
    <rect x="755.0" y="250" width="250" height="34" rx="14" fill="#ffffff" fill-opacity="0.94"/>
<text x="880" y="272.0" font-size="13" font-weight="700" fill="#10263b" text-anchor="middle">Provide access to data</text>
    <rect x="745.0" y="310" width="270" height="42" rx="14" fill="#ffffff" fill-opacity="0.94"/>
<text x="880" y="327.0" font-size="13" font-weight="700" fill="#10263b" text-anchor="middle">Advertising or behavioural</text>
<text x="880" y="345.0" font-size="13" font-weight="700" fill="#10263b" text-anchor="middle">research</text>
  </g>
</svg>
