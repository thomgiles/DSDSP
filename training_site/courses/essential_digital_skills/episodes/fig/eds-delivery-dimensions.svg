<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">Core dimensions of digital delivery</title>
  <desc id="desc">Five dimensions: transparency, reproducibility, automation, traceability and adaptability.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#10263b" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="1200" height="260" rx="28" fill="#f7fbfc"/>
  <g filter="url(#shadow)" font-family="sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#ffffff">
    <rect x="30" y="85" width="210" height="90" rx="18" fill="#006781"/>
    <text x="135" y="138">Transparency</text>
    <rect x="262" y="85" width="210" height="90" rx="18" fill="#298582"/>
    <text x="367" y="138">Reproducibility</text>
    <rect x="494" y="85" width="210" height="90" rx="18" fill="#009bc1"/>
    <text x="599" y="138">Automation</text>
    <rect x="726" y="85" width="210" height="90" rx="18" fill="#405162"/>
    <text x="831" y="138">Traceability</text>
    <rect x="958" y="85" width="210" height="90" rx="18" fill="#10263b"/>
    <text x="1063" y="138">Adaptability</text>
  </g>
</svg>
