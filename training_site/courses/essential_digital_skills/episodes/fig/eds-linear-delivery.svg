<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Linear research delivery</title>
  <desc id="desc">A sequence of planning, collecting and analysing with handovers between each stage, followed by a combined check. Problems may remain hidden until the final check.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1 L10 6 L1 11 Z" fill="#405162"/>
    </marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#10263b" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="1200" height="360" rx="28" fill="#f7fbfc"/>
  <g fill="none" stroke="#405162" stroke-width="4" marker-end="url(#arrow)">
    <path d="M280 140 H335"/>
    <path d="M565 140 H620"/>
    <path d="M850 140 H905"/>
  </g>
  <g font-family="sans-serif" text-anchor="middle">
    <g filter="url(#shadow)" font-size="24" font-weight="700" fill="#ffffff">
      <rect x="50" y="98" width="230" height="84" rx="18" fill="#006781"/>
      <text x="165" y="149">Plan</text>
      <rect x="335" y="98" width="230" height="84" rx="18" fill="#298582"/>
      <text x="450" y="149">Collect</text>
      <rect x="620" y="98" width="230" height="84" rx="18" fill="#009bc1"/>
      <text x="735" y="149">Analyse</text>
      <rect x="905" y="98" width="245" height="84" rx="18" fill="#10263b"/>
      <text x="1027" y="132">Combined</text>
      <text x="1027" y="161">check</text>
    </g>
    <g font-size="18" fill="#405162">
      <text x="307" y="218">Handover</text>
      <text x="592" y="218">Handover</text>
      <text x="877" y="218">Handover</text>
      <text x="600" y="292">If the first combined check is at the end, problems may stay hidden until then.</text>
    </g>
  </g>
</svg>
