<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="title desc">
  <title id="title">Review one authoritative document together</title>
  <desc id="desc">Co-authors draft in an agreed location, propose edits and comments, decide which changes to retain, then record an approved version. Further revisions return to the same authoritative source. Version history supports checking saved states.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1 1 L8 5 L1 9 Z" fill="#405162"/>
    </marker>
  </defs>
  <rect width="1200" height="350" rx="28" fill="#f7fbfc"/>
  <g font-family="sans-serif" text-anchor="middle">
    <text x="600" y="47" font-size="28" font-weight="700" fill="#10263b">One authoritative source; a clear review process</text>
    <g fill="none" stroke="#405162" stroke-width="3" marker-end="url(#arrow)">
      <path d="M294 154 H319"/>
      <path d="M584 154 H609"/>
      <path d="M874 154 H899"/>
      <path d="M1035 222 V282 H165 V228"/>
    </g>
    <rect x="36" y="88" width="258" height="134" rx="18" fill="#10263b"/>
    <rect x="326" y="88" width="258" height="134" rx="18" fill="#006781"/>
    <rect x="616" y="88" width="258" height="134" rx="18" fill="#298582"/>
    <rect x="906" y="88" width="258" height="134" rx="18" fill="#405162"/>
    <g fill="#ffffff">
      <text x="165" y="128" font-size="29" font-weight="700">Draft</text>
      <text x="165" y="169" font-size="23">Work in the</text>
      <text x="165" y="198" font-size="23">agreed location</text>
      <text x="455" y="128" font-size="29" font-weight="700">Review</text>
      <text x="455" y="169" font-size="23">Propose edits;</text>
      <text x="455" y="198" font-size="23">ask questions</text>
      <text x="745" y="128" font-size="29" font-weight="700">Decide</text>
      <text x="745" y="169" font-size="23">Check evidence;</text>
      <text x="745" y="198" font-size="23">accept or reject</text>
      <text x="1035" y="128" font-size="29" font-weight="700">Approve</text>
      <text x="1035" y="169" font-size="23">Record the version</text>
      <text x="1035" y="198" font-size="23">used for submission</text>
    </g>
    <rect x="375" y="263" width="450" height="38" rx="12" fill="#f7fbfc"/>
    <text x="600" y="289" font-size="24" font-weight="700" fill="#006781">Return revisions to the same source</text>
    <text x="600" y="328" font-size="23" fill="#405162">Use version history to inspect saved states; review markup records proposed edits.</text>
  </g>
</svg>
