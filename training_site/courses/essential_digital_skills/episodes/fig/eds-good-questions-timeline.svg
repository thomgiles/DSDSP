<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Good questions to good data timeline</title>
  <desc id="desc">A vague idea becomes useful data through analysis purpose, measurable questions, variable choices, and removal of irrelevant fields.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#405162"/>
    </marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="145%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#10263b" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="1200" height="330" rx="28" fill="#f7fbfc"/>
  <g stroke="#405162" stroke-width="5" marker-end="url(#arrow)" fill="none">
    <path d="M152.8 160 H1047.2"/>
  </g><g filter="url(#shadow)" font-family="sans-serif">
    <rect x="55.0" y="95" width="195.6" height="135" rx="20" fill="#006781"/>
    <circle cx="83.0" cy="115" r="18" fill="#ffffff" fill-opacity="0.24"/>
    <rect x="278.6" y="95" width="195.6" height="135" rx="20" fill="#298582"/>
    <circle cx="306.6" cy="115" r="18" fill="#ffffff" fill-opacity="0.24"/>
    <rect x="502.2" y="95" width="195.6" height="135" rx="20" fill="#405162"/>
    <circle cx="530.2" cy="115" r="18" fill="#ffffff" fill-opacity="0.24"/>
    <rect x="725.8" y="95" width="195.6" height="135" rx="20" fill="#009bc1"/>
    <circle cx="753.8" cy="115" r="18" fill="#ffffff" fill-opacity="0.24"/>
    <rect x="949.4" y="95" width="195.6" height="135" rx="20" fill="#10263b"/>
    <circle cx="977.4" cy="115" r="18" fill="#ffffff" fill-opacity="0.24"/>
  </g><g font-family="sans-serif">
    <text x="83.0" y="122" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">1</text>
<text x="152.8" y="151.0" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Vague idea</text>
<text x="152.8" y="186.0" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle">Improve campus</text>
<text x="152.8" y="210.0" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle">transport</text>
    <text x="306.6" y="122" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">2</text>
<text x="376.40000000000003" y="139.0" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Analysis</text>
<text x="376.40000000000003" y="163.0" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">purpose</text>
<text x="376.40000000000003" y="186.0" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle">Link demographics</text>
<text x="376.40000000000003" y="210.0" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle">to commute burden</text>
    <text x="530.2" y="122" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">3</text>
<text x="600.0" y="139.0" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Measurable</text>
<text x="600.0" y="163.0" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">questions</text>
<text x="600.0" y="186.0" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle">Cycle rates and</text>
<text x="600.0" y="210.0" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle">commute times</text>
    <text x="753.8" y="122" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">4</text>
<text x="823.5999999999999" y="139.0" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Decide</text>
<text x="823.5999999999999" y="163.0" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">variables</text>
<text x="823.5999999999999" y="186.0" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle">Time, status,</text>
<text x="823.5999999999999" y="210.0" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle">transport method</text>
    <text x="977.4" y="122" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">5</text>
<text x="1047.2" y="127.0" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Drop</text>
<text x="1047.2" y="151.0" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">irrelevant</text>
<text x="1047.2" y="175.0" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">fields</text>
<text x="1047.2" y="186.0" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle">Remove height and</text>
<text x="1047.2" y="210.0" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle">snack preference</text>
  </g>
</svg>
