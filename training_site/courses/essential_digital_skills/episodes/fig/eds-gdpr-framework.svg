<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">GDPR framework roles</title>
  <desc id="desc">The GDPR framework connects data subjects, controllers, processors, and storage or cloud services with related data activities.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#405162"/>
    </marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="145%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#10263b" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="1200" height="330" rx="28" fill="#f7fbfc"/>
  <g stroke="#405162" stroke-width="4" marker-end="url(#arrow)" fill="none">
    <path d="M301.8 145 H340.8"/>
    <path d="M580.5 145 H619.5"/>
    <path d="M859.2 145 H898.2"/>
    <path d="M181.9 200 V225"/>
    <path d="M460.6 200 V225"/>
    <path d="M739.4 200 V225"/>
    <path d="M1018.1 200 V225"/>
  </g><g filter="url(#shadow)" font-family="sans-serif">
    <rect x="70.0" y="90" width="223.8" height="110" rx="18" fill="#006781"/>
    <rect x="80.0" y="235" width="203.8" height="62" rx="16" fill="#006781" fill-opacity="0.82" stroke="#006781" stroke-dasharray="5 5"/>
    <rect x="348.8" y="90" width="223.8" height="110" rx="18" fill="#298582"/>
    <rect x="358.8" y="235" width="203.8" height="62" rx="16" fill="#298582" fill-opacity="0.82" stroke="#298582" stroke-dasharray="5 5"/>
    <rect x="627.5" y="90" width="223.8" height="110" rx="18" fill="#405162"/>
    <rect x="637.5" y="235" width="203.8" height="62" rx="16" fill="#405162" fill-opacity="0.82" stroke="#405162" stroke-dasharray="5 5"/>
    <rect x="906.2" y="90" width="223.8" height="110" rx="18" fill="#009bc1"/>
    <rect x="916.2" y="235" width="203.8" height="62" rx="16" fill="#009bc1" fill-opacity="0.82" stroke="#009bc1" stroke-dasharray="5 5"/>
  </g><g font-family="sans-serif">
<text x="181.875" y="152.0" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Data Subject</text>
<text x="181.875" y="272.0" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Provides data</text>
<text x="460.625" y="140.0" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Researcher /</text>
<text x="460.625" y="164.0" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Controller</text>
<text x="460.625" y="272.0" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Processes data</text>
<text x="739.375" y="140.0" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Processor /</text>
<text x="739.375" y="164.0" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Collaborator</text>
<text x="739.375" y="260.0" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Transfers or</text>
<text x="739.375" y="284.0" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">shares data</text>
<text x="1018.125" y="140.0" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Data Storage /</text>
<text x="1018.125" y="164.0" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Cloud</text>
<text x="1018.125" y="260.0" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Access and</text>
<text x="1018.125" y="284.0" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">retention</text>
  </g>
</svg>
