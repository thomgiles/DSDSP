<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="205" viewBox="0 205 1200 205" role="img" aria-labelledby="title desc">
  <title id="title">Expression pipeline</title>
  <desc id="desc">Raw input is cleaned, formatted, tested, routed, and turned into readable output.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#10263b" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#405162"/>
    </marker>
  </defs>
  <rect y="205" width="1200" height="205" rx="28" fill="#f7fbfc"/>
  <g stroke="#405162" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M250 310 L330 310"/>
    <path d="M470 310 L550 310"/>
    <path d="M690 310 L770 310"/>
    <path d="M910 310 L990 310"/>
  </g>
  <g font-family="Arial, sans-serif" text-anchor="middle" filter="url(#shadow)">
    <rect x="70" y="240" width="180" height="140" rx="22" fill="#405162"/>
    <rect x="330" y="240" width="140" height="140" rx="22" fill="#006781"/>
    <rect x="550" y="240" width="140" height="140" rx="22" fill="#298582"/>
    <rect x="770" y="240" width="140" height="140" rx="22" fill="#009bc1"/>
    <rect x="990" y="240" width="140" height="140" rx="22" fill="#10263b"/>
  </g>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#fff">
    <text x="160" y="300" font-size="22" font-weight="700">Raw input</text>
    <text x="160" y="328" font-size="16">from trigger</text>
    <text x="400" y="300" font-size="22" font-weight="700">Clean</text>
    <text x="400" y="328" font-size="16">toLower()</text>
    <text x="620" y="300" font-size="22" font-weight="700">Format</text>
    <text x="620" y="328" font-size="16">dates, text</text>
    <text x="840" y="300" font-size="22" font-weight="700">Test</text>
    <text x="840" y="328" font-size="16">equals()</text>
    <text x="1060" y="300" font-size="22" font-weight="700">Route</text>
    <text x="1060" y="328" font-size="16">condition</text>
  </g>
</svg>
