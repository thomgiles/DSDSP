<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 105 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Condition branch in Power Automate</title>
  <desc id="desc">A request is normalised, checked for urgency, routed to urgent or standard handling, and then continues.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#10263b" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#405162"/>
    </marker>
  </defs>
  <rect y="105" width="1200" height="380" rx="28" fill="#f7fbfc"/>
  <g stroke="#405162" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M250 295 L370 295"/>
    <path d="M520 295 L610 295"/>
    <path d="M730 250 C805 195 875 175 965 180"/>
    <path d="M730 340 C805 395 875 415 965 410"/>
    <path d="M1045 215 C1085 270 1085 330 1045 385"/>
  </g>
  <g font-family="Arial, sans-serif" text-anchor="middle" filter="url(#shadow)">
    <rect x="80" y="235" width="170" height="120" rx="22" fill="#405162"/>
    <rect x="370" y="235" width="150" height="120" rx="22" fill="#006781"/>
    <polygon points="670,205 770,295 670,385 570,295" fill="#fff" stroke="#009bc1" stroke-width="4"/>
    <rect x="965" y="135" width="165" height="90" rx="20" fill="#298582"/>
    <rect x="965" y="365" width="165" height="90" rx="20" fill="#009bc1"/>
  </g>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="165" y="285" font-size="21" font-weight="700" fill="#fff">Request</text>
    <text x="165" y="313" font-size="16" fill="#fff">data</text>
    <text x="445" y="285" font-size="21" font-weight="700" fill="#fff">Normalise</text>
    <text x="445" y="313" font-size="16" fill="#fff">the value</text>
    <text x="670" y="286" font-size="19" font-weight="700" fill="#10263b">Contains</text>
    <text x="670" y="312" font-size="19" font-weight="700" fill="#10263b">urgent?</text>
    <text x="925" y="170" font-size="18" font-weight="700" fill="#10263b">Yes</text>
    <text x="1048" y="174" font-size="20" font-weight="700" fill="#fff">Urgent path</text>
    <text x="925" y="405" font-size="18" font-weight="700" fill="#10263b">No</text>
    <text x="1048" y="404" font-size="20" font-weight="700" fill="#fff">Standard path</text>
  </g>
</svg>
