<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 80 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Power Automate connector landscape</title>
  <desc id="desc">Power Automate connects to Microsoft 365, data stores, documents, communication tools, business apps, and custom APIs.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#405162"/>
    </marker>
  </defs>
  <rect y="80" width="1200" height="420" rx="28" fill="#f7fbfc"/>
  <circle cx="600" cy="285" r="92" fill="#10263b"/>
  <text x="600" y="273" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#ffffff">Power</text>
  <text x="600" y="306" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#ffffff">Automate</text>
  <text x="600" y="337" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#d7eef3">trigger + actions</text>

  <g stroke="#405162" stroke-width="4" marker-end="url(#arrow)" fill="none">
    <path d="M525 235 L356 170"/>
    <path d="M600 193 L600 155"/>
    <path d="M675 235 L844 170"/>
    <path d="M525 335 L356 400"/>
    <path d="M600 377 L600 415"/>
    <path d="M675 335 L844 400"/>
  </g>

  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g>
      <rect x="165" y="110" width="260" height="82" rx="18" fill="#006781"/>
      <text x="295" y="142" font-size="21" font-weight="700" fill="#ffffff">Microsoft 365</text>
      <text x="295" y="169" font-size="15" fill="#ffffff">Outlook, Teams, SharePoint</text>
    </g>
    <g>
      <rect x="470" y="100" width="260" height="82" rx="18" fill="#298582"/>
      <text x="600" y="132" font-size="21" font-weight="700" fill="#ffffff">Data</text>
      <text x="600" y="159" font-size="15" fill="#ffffff">Excel, Lists, Dataverse, SQL</text>
    </g>
    <g>
      <rect x="775" y="110" width="260" height="82" rx="18" fill="#009bc1"/>
      <text x="905" y="142" font-size="21" font-weight="700" fill="#ffffff">Documents</text>
      <text x="905" y="169" font-size="15" fill="#ffffff">Word, OneDrive, PDF</text>
    </g>
    <g>
      <rect x="165" y="378" width="260" height="82" rx="18" fill="#405162"/>
      <text x="295" y="410" font-size="21" font-weight="700" fill="#ffffff">Communication</text>
      <text x="295" y="437" font-size="15" fill="#ffffff">Email, Teams, notifications</text>
    </g>
    <g>
      <rect x="470" y="390" width="260" height="82" rx="18" fill="#006781"/>
      <text x="600" y="422" font-size="21" font-weight="700" fill="#ffffff">Business Apps</text>
      <text x="600" y="449" font-size="15" fill="#ffffff">Planner, Dynamics, Jira</text>
    </g>
    <g>
      <rect x="775" y="378" width="260" height="82" rx="18" fill="#298582"/>
      <text x="905" y="410" font-size="21" font-weight="700" fill="#ffffff">Custom/API</text>
      <text x="905" y="437" font-size="15" fill="#ffffff">HTTP, webhooks, custom connectors</text>
    </g>
  </g>
</svg>
