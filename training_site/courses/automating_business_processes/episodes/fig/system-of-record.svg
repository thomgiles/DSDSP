<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="445" viewBox="0 95 1200 445" role="img" aria-labelledby="title desc">
  <title id="title">Choosing a system of record</title>
  <desc id="desc">A workflow checks whether an official record exists, then either points to it or creates one before notifying people.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#10263b" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#405162"/>
    </marker>
  </defs>
  <rect y="95" width="1200" height="445" rx="28" fill="#f7fbfc"/>
  <g stroke="#405162" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M300 185 L475 185"/>
    <path d="M600 255 L600 330"/>
    <path d="M520 420 L395 420"/>
    <path d="M680 420 L805 420"/>
    <path d="M400 455 C500 520 700 520 800 455"/>
  </g>
  <g font-family="Arial, sans-serif" text-anchor="middle" filter="url(#shadow)">
    <rect x="120" y="135" width="180" height="100" rx="20" fill="#006781"/>
    <polygon points="600,120 755,185 600,250 445,185" fill="#fff" stroke="#009bc1" stroke-width="4"/>
    <rect x="245" y="370" width="210" height="100" rx="20" fill="#298582"/>
    <rect x="745" y="370" width="210" height="100" rx="20" fill="#009bc1"/>
    <rect x="500" y="330" width="200" height="100" rx="20" fill="#405162"/>
  </g>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="210" y="178" font-size="20" font-weight="700" fill="#fff">Flow Sends</text>
    <text x="210" y="204" font-size="18" fill="#fff">a Message</text>
    <text x="600" y="178" font-size="20" font-weight="700" fill="#10263b">Official</text>
    <text x="600" y="204" font-size="20" font-weight="700" fill="#10263b">record?</text>
    <text x="350" y="410" font-size="20" font-weight="700" fill="#fff">Point to the</text>
    <text x="350" y="436" font-size="18" fill="#fff">existing record</text>
    <text x="850" y="410" font-size="20" font-weight="700" fill="#fff">Create or</text>
    <text x="850" y="436" font-size="18" fill="#fff">update a record</text>
    <text x="600" y="372" font-size="18" font-weight="700" fill="#fff">No record?</text>
    <text x="600" y="398" font-size="16" fill="#fff">fix that first</text>
  </g>
</svg>
