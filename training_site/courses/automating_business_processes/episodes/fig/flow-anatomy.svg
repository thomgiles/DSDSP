<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="170" viewBox="0 85 1200 170" role="img" aria-labelledby="title desc">
  <title id="title">Power Automate flow anatomy</title>
  <desc id="desc">A trigger starts the flow, actions shape data, a decision routes work, an outcome is recorded, and people are notified.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#405162"/>
    </marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#10263b" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect y="85" width="1200" height="170" rx="28" fill="#f7fbfc"/>
  <g filter="url(#shadow)">
    <rect x="70" y="120" width="160" height="110" rx="18" fill="#006781"/>
    <rect x="285" y="120" width="160" height="110" rx="18" fill="#298582"/>
    <rect x="500" y="120" width="160" height="110" rx="18" fill="#405162"/>
    <rect x="715" y="120" width="160" height="110" rx="18" fill="#009bc1"/>
    <rect x="930" y="120" width="160" height="110" rx="18" fill="#10263b"/>
  </g>

  <g font-family="Arial, sans-serif" fill="#ffffff" text-anchor="middle">
    <text x="150" y="158" font-size="23" font-weight="700">Trigger</text>
    <text x="150" y="190" font-size="16">What starts it?</text>
    <text x="365" y="158" font-size="23" font-weight="700">Actions</text>
    <text x="365" y="190" font-size="16">Get and shape data</text>
    <text x="580" y="158" font-size="23" font-weight="700">Decision</text>
    <text x="580" y="190" font-size="16">Condition or approval</text>
    <text x="795" y="158" font-size="23" font-weight="700">Record</text>
    <text x="795" y="190" font-size="16">Write the outcome</text>
    <text x="1010" y="158" font-size="23" font-weight="700">Notify</text>
    <text x="1010" y="190" font-size="16">Tell the right people</text>
  </g>

  <g stroke="#405162" stroke-width="5" marker-end="url(#arrow)" fill="none">
    <path d="M235 175 H275"/>
    <path d="M450 175 H490"/>
    <path d="M665 175 H705"/>
    <path d="M880 175 H920"/>
  </g>
</svg>
