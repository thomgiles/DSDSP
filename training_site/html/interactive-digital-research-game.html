<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Digital Research Space Game</title>
  <style>
    :root {
      --ink: #10263b;
      --muted: #405162;
      --sky: #009bc1;
      --teal: #37b4b0;
      --coral: #e85d4f;
      --gold: #f2b84b;
      --paper: #f7fafb;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--paper);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .hud {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      min-height: 4.25rem;
      padding: 0.75rem clamp(1rem, 3vw, 2rem);
      background: rgba(255, 255, 255, 0.92);
      border-bottom: 1px solid rgba(16, 38, 59, 0.12);
      box-shadow: 0 10px 30px rgba(16, 38, 59, 0.08);
    }

    .title {
      display: grid;
      gap: 0.15rem;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.05rem, 2vw, 1.45rem);
      line-height: 1.1;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 0.82rem;
      line-height: 1.35;
    }

    .stats {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 0.5rem;
      min-width: 15rem;
    }

    .stat,
    button {
      min-height: 2.3rem;
      border: 1px solid rgba(16, 38, 59, 0.14);
      border-radius: 8px;
      background: var(--white);
      color: var(--ink);
      font: inherit;
      font-size: 0.88rem;
      font-weight: 700;
    }

    .stat {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.45rem 0.7rem;
    }

    .stat span {
      color: var(--sky);
      font-variant-numeric: tabular-nums;
    }

    button {
      cursor: pointer;
      padding: 0.45rem 0.85rem;
    }

    button:hover,
    button:focus-visible {
      border-color: var(--sky);
      outline: 2px solid rgba(0, 155, 193, 0.18);
      outline-offset: 2px;
    }

    .game {
      position: relative;
      min-height: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 20% 25%, rgba(55, 180, 176, 0.16), transparent 28%),
        radial-gradient(circle at 80% 18%, rgba(0, 155, 193, 0.14), transparent 30%),
        linear-gradient(180deg, #ffffff 0%, #eef5f6 100%);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .overlay {
      position: absolute;
      inset: auto 1rem 1rem 1rem;
      z-index: 2;
      display: flex;
      justify-content: center;
      pointer-events: none;
    }

    .message {
      max-width: min(42rem, 100%);
      padding: 0.75rem 1rem;
      border: 1px solid rgba(16, 38, 59, 0.12);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.9);
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.4;
      text-align: center;
      box-shadow: 0 10px 30px rgba(16, 38, 59, 0.08);
    }

    @media (max-width: 720px) {
      .hud {
        align-items: flex-start;
        flex-direction: column;
      }

      .stats {
        justify-content: flex-start;
        min-width: 0;
      }
    }
  </style>
</head>

<body>
  <header class="hud">
    <div class="title">
      <h1>Digital Research Space Game</h1>
      <p class="subtitle">Gather data, build stations, and keep the research network alive.</p>
    </div>
    <div class="stats" aria-label="Game status">
      <div class="stat">Data <span id="dataCount">0</span></div>
      <div class="stat">Ships <span id="shipCount">1</span></div>
      <div class="stat">Stations <span id="stationCount">0</span></div>
      <button id="restartButton" type="button">Restart</button>
    </div>
  </header>

  <main class="game">
    <canvas id="rjsH1Canvas" aria-label="Digital research space game"></canvas>
    <div class="overlay">
      <div class="message" id="message">Move with arrow keys or WASD. Collect blue data nodes. Press Space near the centre to build a station.</div>
    </div>
  </main>

  <script>
    (() => {
      "use strict";

      const canvas = document.getElementById("rjsH1Canvas");
      const ctx = canvas.getContext("2d");
      const dataCount = document.getElementById("dataCount");
      const shipCount = document.getElementById("shipCount");
      const stationCount = document.getElementById("stationCount");
      const message = document.getElementById("message");
      const restartButton = document.getElementById("restartButton");

      const state = {
        width: 0,
        height: 0,
        frame: 0,
        data: 0,
        gameOver: false,
        player: { x: 0, y: 0, vx: 0, vy: 0, radius: 15 },
        keys: new Set(),
        nodes: [],
        ships: [],
        stations: [],
        particles: [],
        rng: mulberry32(seedFromLocation())
      };

      const colours = {
        ink: "#10263b",
        muted: "#405162",
        sky: "#009bc1",
        teal: "#37b4b0",
        coral: "#e85d4f",
        gold: "#f2b84b",
        white: "#ffffff"
      };

      function seedFromLocation() {
        const params = new URLSearchParams(window.location.search);
        const seed = params.get("space-seed") || window.localStorage.getItem("space-seed") || String(Date.now());
        window.localStorage.setItem("space-seed", seed);

        let hash = 2166136261;
        for (let i = 0; i < seed.length; i += 1) {
          hash ^= seed.charCodeAt(i);
          hash = Math.imul(hash, 16777619);
        }
        return hash >>> 0;
      }

      function mulberry32(seed) {
        return function nextRandom() {
          seed |= 0;
          seed = seed + 0x6d2b79f5 | 0;
          let value = Math.imul(seed ^ seed >>> 15, 1 | seed);
          value = value + Math.imul(value ^ value >>> 7, 61 | value) ^ value;
          return ((value ^ value >>> 14) >>> 0) / 4294967296;
        };
      }

      function randomBetween(min, max) {
        return min + (max - min) * state.rng();
      }

      function distance(a, b) {
        return Math.hypot(a.x - b.x, a.y - b.y);
      }

      function resize() {
        const rect = canvas.getBoundingClientRect();
        const dpr = Math.max(1, Math.min(window.devicePixelRatio || 1, 2));
        state.width = Math.max(320, rect.width);
        state.height = Math.max(260, rect.height);
        canvas.width = Math.round(state.width * dpr);
        canvas.height = Math.round(state.height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      function reset(seed) {
        state.rng = mulberry32(seed || seedFromLocation());
        state.frame = 0;
        state.data = 0;
        state.gameOver = false;
        state.player.x = state.width * 0.5 || window.innerWidth * 0.5;
        state.player.y = state.height * 0.58 || window.innerHeight * 0.58;
        state.player.vx = 0;
        state.player.vy = 0;
        state.nodes = [];
        state.ships = [
          { x: state.player.x - 44, y: state.player.y + 28, angle: -0.7, target: null }
        ];
        state.stations = [];
        state.particles = [];
        spawnNodes(18);
        updateHud();
        message.textContent = "Move with arrow keys or WASD. Collect blue data nodes. Press Space near the centre to build a station.";
      }

      function spawnNodes(count) {
        for (let i = 0; i < count; i += 1) {
          state.nodes.push({
            x: randomBetween(36, state.width - 36),
            y: randomBetween(36, state.height - 36),
            radius: randomBetween(6, 10),
            phase: randomBetween(0, Math.PI * 2)
          });
        }
      }

      function updateHud() {
        dataCount.textContent = String(state.data);
        shipCount.textContent = String(state.ships.length);
        stationCount.textContent = String(state.stations.length);
      }

      function addParticles(x, y, colour, count = 12) {
        for (let i = 0; i < count; i += 1) {
          const angle = randomBetween(0, Math.PI * 2);
          const speed = randomBetween(0.7, 2.6);
          state.particles.push({
            x,
            y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: randomBetween(24, 46),
            colour
          });
        }
      }

      function buildStation() {
        if (state.data < 8) {
          message.textContent = "Collect 8 data nodes before building a station.";
          return;
        }

        const centre = { x: state.width * 0.5, y: state.height * 0.52 };
        if (distance(state.player, centre) > Math.min(state.width, state.height) * 0.2) {
          message.textContent = "Bring your ship closer to the centre before building.";
          return;
        }

        state.data -= 8;
        state.stations.push({
          x: state.player.x,
          y: state.player.y,
          radius: 28,
          pulse: 0
        });

        if (state.ships.length < 5) {
          state.ships.push({
            x: state.player.x,
            y: state.player.y,
            angle: randomBetween(0, Math.PI * 2),
            target: null
          });
        }

        addParticles(state.player.x, state.player.y, colours.gold, 20);
        message.textContent = "Station built. Extra research ships now help collect data.";
        updateHud();
      }

      function updatePlayer() {
        const thrust = 0.36;
        const drag = 0.93;

        if (state.keys.has("arrowup") || state.keys.has("w")) state.player.vy -= thrust;
        if (state.keys.has("arrowdown") || state.keys.has("s")) state.player.vy += thrust;
        if (state.keys.has("arrowleft") || state.keys.has("a")) state.player.vx -= thrust;
        if (state.keys.has("arrowright") || state.keys.has("d")) state.player.vx += thrust;

        state.player.vx *= drag;
        state.player.vy *= drag;
        state.player.x = Math.max(18, Math.min(state.width - 18, state.player.x + state.player.vx));
        state.player.y = Math.max(18, Math.min(state.height - 18, state.player.y + state.player.vy));
      }

      function updateShips() {
        state.ships.forEach((ship) => {
          if (!ship.target || !state.nodes.includes(ship.target)) {
            ship.target = state.nodes[Math.floor(state.rng() * state.nodes.length)] || null;
          }

          const target = ship.target || state.player;
          const angle = Math.atan2(target.y - ship.y, target.x - ship.x);
          ship.angle = angle;
          ship.x += Math.cos(angle) * 1.65;
          ship.y += Math.sin(angle) * 1.65;

          if (ship.target && distance(ship, ship.target) < ship.target.radius + 8) {
            collectNode(ship.target, true);
            ship.target = null;
          }
        });
      }

      function collectNode(node, automated = false) {
        const index = state.nodes.indexOf(node);
        if (index === -1) return;

        state.nodes.splice(index, 1);
        state.data += automated ? 1 : 2;
        addParticles(node.x, node.y, automated ? colours.teal : colours.sky, 10);

        if (state.nodes.length < 12) {
          spawnNodes(6);
        }

        updateHud();
      }

      function updateNodes() {
        for (const node of [...state.nodes]) {
          if (distance(state.player, node) < state.player.radius + node.radius + 3) {
            collectNode(node);
          }
        }
      }

      function updateStations() {
        state.stations.forEach((station) => {
          station.pulse = (station.pulse + 0.035) % 1;
          if (state.frame % 180 === 0) {
            state.data += 1;
            addParticles(station.x, station.y, colours.gold, 6);
            updateHud();
          }
        });
      }

      function updateParticles() {
        state.particles = state.particles.filter((particle) => {
          particle.x += particle.vx;
          particle.y += particle.vy;
          particle.vx *= 0.98;
          particle.vy *= 0.98;
          particle.life -= 1;
          return particle.life > 0;
        });
      }

      function update() {
        state.frame += 1;
        updatePlayer();
        updateShips();
        updateNodes();
        updateStations();
        updateParticles();
      }

      function drawGrid() {
        ctx.save();
        ctx.strokeStyle = "rgba(16, 38, 59, 0.07)";
        ctx.lineWidth = 1;

        for (let x = (state.frame * -0.25) % 48; x < state.width; x += 48) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, state.height);
          ctx.stroke();
        }

        for (let y = 0; y < state.height; y += 48) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(state.width, y);
          ctx.stroke();
        }
        ctx.restore();
      }

      function drawPlayer() {
        const angle = Math.atan2(state.player.vy, state.player.vx || 0.001);
        drawShip(state.player.x, state.player.y, angle, colours.ink, 1.15);
      }

      function drawShip(x, y, angle, colour, scale = 0.8) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle);
        ctx.scale(scale, scale);
        ctx.fillStyle = colour;
        ctx.beginPath();
        ctx.moveTo(18, 0);
        ctx.lineTo(-12, -10);
        ctx.lineTo(-7, 0);
        ctx.lineTo(-12, 10);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = colours.white;
        ctx.beginPath();
        ctx.arc(0, 0, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      function drawStation(station) {
        const pulseRadius = station.radius + station.pulse * 28;
        ctx.save();
        ctx.strokeStyle = `rgba(242, 184, 75, ${0.38 * (1 - station.pulse)})`;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(station.x, station.y, pulseRadius, 0, Math.PI * 2);
        ctx.stroke();

        ctx.fillStyle = colours.white;
        ctx.strokeStyle = colours.gold;
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(station.x, station.y, station.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = colours.gold;
        ctx.fillRect(station.x - 5, station.y - 18, 10, 36);
        ctx.fillRect(station.x - 18, station.y - 5, 36, 10);
        ctx.restore();
      }

      function drawNode(node) {
        const float = Math.sin(state.frame * 0.04 + node.phase) * 2.2;
        ctx.save();
        ctx.fillStyle = colours.sky;
        ctx.strokeStyle = colours.white;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(node.x, node.y + float, node.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      }

      function drawParticles() {
        state.particles.forEach((particle) => {
          ctx.save();
          ctx.globalAlpha = Math.max(0, particle.life / 46);
          ctx.fillStyle = particle.colour;
          ctx.beginPath();
          ctx.arc(particle.x, particle.y, 2.4, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        });
      }

      function draw() {
        ctx.clearRect(0, 0, state.width, state.height);
        drawGrid();

        state.nodes.forEach(drawNode);
        state.stations.forEach(drawStation);
        state.ships.forEach((ship) => drawShip(ship.x, ship.y, ship.angle, colours.teal));
        drawPlayer();
        drawParticles();
      }

      function loop() {
        update();
        draw();
        window.requestAnimationFrame(loop);
      }

      function runFrames(frames) {
        const result = {
          survived: true,
          firstStationFrame: null,
          firstOccupationFrame: null,
          maxShips: state.ships.length,
          maxStations: state.stations.length,
          maxOccupied: 0,
          collapseFrame: null
        };

        for (let i = 0; i < frames; i += 1) {
          if (state.data >= 8 && state.stations.length === 0) {
            state.player.x = state.width * 0.5;
            state.player.y = state.height * 0.52;
            buildStation();
            result.firstStationFrame = state.frame;
            result.firstOccupationFrame = state.frame;
          }

          update();
          result.maxShips = Math.max(result.maxShips, state.ships.length);
          result.maxStations = Math.max(result.maxStations, state.stations.length);
          result.maxOccupied = Math.max(result.maxOccupied, state.stations.length);
        }

        return result;
      }

      window.addEventListener("keydown", (event) => {
        const key = event.key.toLowerCase();
        if (["arrowup", "arrowdown", "arrowleft", "arrowright", "w", "a", "s", "d", " "].includes(key)) {
          event.preventDefault();
        }

        if (key === " ") {
          buildStation();
          return;
        }

        state.keys.add(key);
      });

      window.addEventListener("keyup", (event) => {
        state.keys.delete(event.key.toLowerCase());
      });

      restartButton.addEventListener("click", () => {
        window.localStorage.setItem("space-seed", String(Date.now()));
        reset();
      });

      window.addEventListener("resize", () => {
        resize();
        if (!state.player.x || !state.player.y) {
          reset();
        }
      });

      window.__rjsH1SpaceSim = {
        reseed(seed) {
          let hash = 2166136261;
          String(seed).split("").forEach((character) => {
            hash ^= character.charCodeAt(0);
            hash = Math.imul(hash, 16777619);
          });
          reset(hash >>> 0);
        },
        runFrames
      };

      resize();
      reset();
      loop();
    })();
  </script>
</body>
</html>
