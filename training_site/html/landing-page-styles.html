.landing-orbit-ring {
  position: absolute;
  inset: 8%;
  border: 1px solid rgba(255, 255, 255, 0.34);
  border-radius: 50%;
  background:
    radial-gradient(circle, transparent 58%, rgba(255, 255, 255, 0.08) 59%, transparent 61%),
    conic-gradient(from 90deg, rgba(255, 255, 255, 0.04), rgba(0, 155, 193, 0.2), rgba(41, 133, 130, 0.18), rgba(255, 255, 255, 0.04));
  box-shadow:
    inset 0 0 38px rgba(255, 255, 255, 0.07),
    0 0 0 18px rgba(255, 255, 255, 0.035);
  animation: landing-rotate 40s linear infinite;
}

.landing-orbit-ring::before,
.landing-orbit-ring::after {
  content: "";
  position: absolute;
  inset: 16%;
  border: 1px solid rgba(255, 255, 255, 0.18);
  border-radius: 50%;
  animation: landing-counter-rotate 40s linear infinite;
}

.landing-orbit-ring::after {
  inset: 31%;
  border-style: dashed;
  opacity: 0.72;
}

.landing-orbit-track {
  position: absolute;
  inset: 8%;
  border-radius: 50%;
  transform: rotate(var(--orbit-start));
  transform-origin: 50% 50%;
  animation: landing-orbit-around var(--orbit-speed, 24s) linear infinite;
}

.landing-orbit-node {
  position: absolute;
  left: 50%;
  top: 0;
  display: grid;
  place-items: center;
  width: 98px;
  aspect-ratio: 1;
  padding: 0.5rem;
  border-radius: 50%;
  overflow: hidden;
  color: #ffffff;
  border: 1px solid rgba(255, 255, 255, 0.85);
  box-shadow:
    0 18px 36px rgba(0, 0, 0, 0.25),
    inset -14px -18px 24px rgba(16, 38, 59, 0.26),
    inset 10px 10px 18px rgba(255, 255, 255, 0.25),
    0 0 24px rgba(0, 155, 193, 0.24);
  font-weight: 900;
  font-size: 0.82rem;
  line-height: 1.05;
  text-align: center;
  z-index: 2;
  transform: translate(-50%, -50%);
  backdrop-filter: blur(8px);
}

.landing-orbit-node p,
.landing-orbit-node span {
  position: relative;
  z-index: 1;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  margin: 0;
  width: 100%;
  height: 100%;
  text-align: center;
  pointer-events: none;
  animation: landing-orbit-label var(--orbit-speed, 24s) linear infinite;
}

.landing-orbit-node::before {
  content: "";
  position: absolute;
  inset: 9% 14% auto auto;
  width: 36%;
  aspect-ratio: 1;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255, 255, 255, 0.88), rgba(255, 255, 255, 0.14) 62%, transparent 70%);
  filter: blur(0.2px);
  opacity: 0.9;
  pointer-events: none;
}

.landing-orbit-node::after {
  content: "";
  position: absolute;
  inset: auto 13% 9% 20%;
  height: 19%;
  border-radius: 50%;
  background: rgba(16, 38, 59, 0.2);
  filter: blur(6px);
  pointer-events: none;
}

.landing-split {

  padding: calc(4rem + 20px) max(1.5rem, calc((100vw - 1160px) / 2));

    linear-gradient(90deg, rgba(16, 38, 59, 0.92), rgba(0, 103, 129, 0.74)),

  color: #ffffff;

.landing-split::before {
  content: "";
  position: absolute;
  inset: 0;

}

.landing-split > * {

.landing-research-grid {

.landing-research-item {

.landing-research-item span {

.landing-research-item strong {

.landing-research-modal {

}

.landing-rhythm-wheel {
  position: relative;

  border-radius: 50%;

    radial-gradient(circle, rgba(41, 133, 130, 0.22) 0 26%, transparent 27%),

  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.2);
}

.landing-rhythm-wheel::before {
  content: "";

  inset: 18%;
  border: 3px dashed rgba(255, 255, 255, 0.42);
  border-radius: 50%;
  animation: landing-rotate 26s linear infinite;
}

.landing-rhythm-core {
  position: absolute;
  inset: 37%;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: rgba(16, 38, 59, 0.78);
  border: 1px solid rgba(255, 255, 255, 0.24);

  line-height: 1.15;
}

.landing-rhythm-step {
  position: absolute;
  display: grid;
  gap: 0.2rem;
  width: min(190px, 45%);
  padding: 0.9rem;
  border-radius: 14px;
  background: rgba(255, 255, 255, 0.94);
  color: #10263b;
  box-shadow: 0 16px 36px rgba(0, 0, 0, 0.18);

.landing-split.is-visible .landing-split-copy,

.landing-split.is-visible .landing-research-item:nth-child(3) { transition-delay: 0.7s, 0.7s, 0s; }
.landing-split.is-visible .landing-research-item:nth-child(4) { transition-delay: 0.84s, 0.84s, 0s; }

.landing-split.is-visible .landing-research-item:hover {

}

.landing-split.is-visible .rhythm-teach { transition-delay: 0.58s; }
.landing-split.is-visible .rhythm-engage { transition-delay: 0.74s; }
.landing-split.is-visible .rhythm-review { transition-delay: 0.9s; }

.landing-rhythm-step span {
  display: grid;
  place-items: center;
  width: 34px;
  aspect-ratio: 1;
  border-radius: 50%;
  background: linear-gradient(135deg, #298582, #0067812);

.landing-rhythm-step strong {

.landing-rhythm-step em {

.rhythm-teach {
  top: 0;
  left: 50%;
  translate: -50% -24%;
}

.rhythm-engage {
  right: -4%;
  bottom: 9%;
  animation-delay: 0.5s;
}

.rhythm-review {
  left: -4%;
  bottom: 9%;
  animation-delay: 1s;

@keyframes landing-rotate {
  to { rotate: 360deg; }
}

@keyframes landing-counter-rotate {
  to { rotate: -360deg; }
}

@keyframes landing-shell-sheen {
  from {
    transform: translateX(-70%);
  }
  to {
    transform: translateX(70%);
  }
}

@keyframes landing-count-pop {
  0% {
    transform: scale(1);
    background: rgba(255, 255, 255, 0.78);
  }
  45% {
    transform: scale(1.04);
    background: rgba(0, 155, 193, 0.16);
  }
  100% {
    transform: scale(1);
    background: rgba(255, 255, 255, 0.78);
  }
}

@keyframes landing-results-in {
  from {
    opacity: 0;
    transform: translateY(18px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes landing-orbit-around {
  from { transform: rotate(var(--orbit-start)); }
  to { transform: rotate(var(--orbit-end)); }
}

@keyframes landing-orbit-label {
  from { transform: rotate(var(--label-start)); }
  to { transform: rotate(var(--label-end)); }
}

@keyframes landing-pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.04); }
}

@keyframes landing-grow {
  from { transform: scaleX(0); }
  to { transform: scaleX(1); }
}

@keyframes landing-ticker {
  from { transform: translateX(0); }
  to { transform: translateX(-50%); }
}

@keyframes landing-sweep {
  0%, 100% { transform: translateX(0) rotate(-8deg); opacity: 0.15; }
  50% { transform: translateX(-18vw) rotate(-8deg); opacity: 0.85; }
}
