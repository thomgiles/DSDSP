<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 80 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Trigger questions for a Power Automate flow</title>
  <desc id="desc">A central trigger connects to five questions about timing, available data, connection identity, frequency, and likely failure points.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#10263b" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#405162"/>
    </marker>
  </defs>
  <rect y="80" width="1200" height="420" rx="28" fill="#f7fbfc"/>
  <g filter="url(#shadow)">
    <rect x="490" y="215" width="220" height="110" rx="24" fill="#006781"/>
  </g>
  <text x="600" y="263" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#fff">Trigger</text>
  <text x="600" y="294" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#fff">the start event</text>
  <g stroke="#405162" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M500 235 C385 200 315 170 250 150"/>
    <path d="M700 235 C815 200 885 170 950 150"/>
    <path d="M500 315 C385 350 300 370 225 390"/>
    <path d="M700 315 C815 350 900 370 975 390"/>
    <path d="M600 325 L600 385"/>
  </g>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g>
      <rect x="110" y="105" width="280" height="80" rx="18" fill="#298582"/>
      <text x="250" y="140" font-size="20" font-weight="700" fill="#ffffff">When should it run?</text>
      <text x="250" y="164" font-size="15" fill="#ffffff">manual, scheduled, event</text>
    </g>
    <g>
      <rect x="810" y="105" width="280" height="80" rx="18" fill="#009bc1"/>
      <text x="950" y="140" font-size="20" font-weight="700" fill="#ffffff">What data is available?</text>
      <text x="950" y="164" font-size="15" fill="#ffffff">fields, files, sender, IDs</text>
    </g>
    <g>
      <rect x="85" y="380" width="280" height="80" rx="18" fill="#405162"/>
      <text x="225" y="415" font-size="20" font-weight="700" fill="#ffffff">Whose connection?</text>
      <text x="225" y="439" font-size="15" fill="#ffffff">person, mailbox, service</text>
    </g>
    <g>
      <rect x="460" y="390" width="280" height="80" rx="18" fill="#006781"/>
      <text x="600" y="425" font-size="20" font-weight="700" fill="#ffffff">How often can it run?</text>
      <text x="600" y="449" font-size="15" fill="#ffffff">duplicates, batches, limits</text>
    </g>
    <g>
      <rect x="835" y="380" width="280" height="80" rx="18" fill="#10263b"/>
      <text x="975" y="415" font-size="20" font-weight="700" fill="#ffffff">What might fail?</text>
      <text x="975" y="439" font-size="15" fill="#ffffff">missing data, access, timing</text>
    </g>
  </g>
</svg>
