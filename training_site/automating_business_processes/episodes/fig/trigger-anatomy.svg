<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Trigger questions for a Power Automate flow</title>
  <desc id="desc">A central trigger connects to five questions about timing, available data, connection identity, frequency, and likely failure points.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#10263b" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#405162"/>
    </marker>
  </defs>
  <rect width="1200" height="620" rx="28" fill="#f7fbfc"/>
  <text x="600" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#10263b">A Trigger Decides How the Flow Starts</text>
  <text x="600" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#405162">Choose the trigger by the real start event and the data it makes available.</text>
  <g filter="url(#shadow)">
    <rect x="490" y="245" width="220" height="120" rx="24" fill="#006781"/>
  </g>
  <text x="600" y="298" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#fff">Trigger</text>
  <text x="600" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#fff">the start event</text>
  <g stroke="#405162" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M500 260 C380 215 310 180 250 150"/>
    <path d="M700 260 C820 215 890 180 950 150"/>
    <path d="M490 335 C350 380 285 415 225 470"/>
    <path d="M710 335 C850 380 915 415 975 470"/>
    <path d="M600 365 L600 490"/>
  </g>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g>
      <rect x="110" y="105" width="280" height="80" rx="18" fill="#fff" stroke="#d8e3e8" stroke-width="2"/>
      <text x="250" y="140" font-size="20" font-weight="700" fill="#10263b">When should it run?</text>
      <text x="250" y="164" font-size="15" fill="#405162">manual, scheduled, event</text>
    </g>
    <g>
      <rect x="810" y="105" width="280" height="80" rx="18" fill="#fff" stroke="#d8e3e8" stroke-width="2"/>
      <text x="950" y="140" font-size="20" font-weight="700" fill="#10263b">What data is available?</text>
      <text x="950" y="164" font-size="15" fill="#405162">fields, files, sender, IDs</text>
    </g>
    <g>
      <rect x="85" y="455" width="280" height="80" rx="18" fill="#fff" stroke="#d8e3e8" stroke-width="2"/>
      <text x="225" y="490" font-size="20" font-weight="700" fill="#10263b">Whose connection?</text>
      <text x="225" y="514" font-size="15" fill="#405162">person, mailbox, service</text>
    </g>
    <g>
      <rect x="460" y="490" width="280" height="80" rx="18" fill="#fff" stroke="#d8e3e8" stroke-width="2"/>
      <text x="600" y="525" font-size="20" font-weight="700" fill="#10263b">How often can it run?</text>
      <text x="600" y="549" font-size="15" fill="#405162">duplicates, batches, limits</text>
    </g>
    <g>
      <rect x="835" y="455" width="280" height="80" rx="18" fill="#fff" stroke="#d8e3e8" stroke-width="2"/>
      <text x="975" y="490" font-size="20" font-weight="700" fill="#10263b">What might fail?</text>
      <text x="975" y="514" font-size="15" fill="#405162">missing data, access, timing</text>
    </g>
  </g>
</svg>
