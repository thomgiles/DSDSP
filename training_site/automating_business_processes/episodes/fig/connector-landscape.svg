<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Power Automate connector landscape</title>
  <desc id="desc">Power Automate connects to Microsoft 365, data stores, documents, communication tools, business apps, and custom APIs.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#405162"/>
    </marker>
  </defs>
  <rect width="1200" height="620" rx="28" fill="#f7fbfc"/>
  <circle cx="600" cy="300" r="118" fill="#10263b"/>
  <text x="600" y="284" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#ffffff">Power</text>
  <text x="600" y="322" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#ffffff">Automate</text>
  <text x="600" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#d7eef3">trigger + actions</text>

  <g stroke="#405162" stroke-width="4" marker-end="url(#arrow)" fill="none">
    <path d="M514 220 L322 130"/>
    <path d="M596 178 L596 90"/>
    <path d="M686 220 L884 130"/>
    <path d="M484 344 L300 470"/>
    <path d="M600 422 L600 530"/>
    <path d="M716 344 L900 470"/>
  </g>

  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g>
      <rect x="165" y="70" width="260" height="96" rx="18" fill="#006781"/>
      <text x="295" y="106" font-size="21" font-weight="700" fill="#ffffff">Microsoft 365</text>
      <text x="295" y="136" font-size="15" fill="#ffffff">Outlook, Teams, SharePoint</text>
    </g>
    <g>
      <rect x="470" y="34" width="260" height="96" rx="18" fill="#298582"/>
      <text x="600" y="70" font-size="21" font-weight="700" fill="#ffffff">Data</text>
      <text x="600" y="100" font-size="15" fill="#ffffff">Excel, Lists, Dataverse, SQL</text>
    </g>
    <g>
      <rect x="775" y="70" width="260" height="96" rx="18" fill="#009bc1"/>
      <text x="905" y="106" font-size="21" font-weight="700" fill="#ffffff">Documents</text>
      <text x="905" y="136" font-size="15" fill="#ffffff">Word, OneDrive, PDF</text>
    </g>
    <g>
      <rect x="165" y="438" width="260" height="96" rx="18" fill="#405162"/>
      <text x="295" y="474" font-size="21" font-weight="700" fill="#ffffff">Communication</text>
      <text x="295" y="504" font-size="15" fill="#ffffff">Email, Teams, notifications</text>
    </g>
    <g>
      <rect x="470" y="490" width="260" height="96" rx="18" fill="#006781"/>
      <text x="600" y="526" font-size="21" font-weight="700" fill="#ffffff">Business Apps</text>
      <text x="600" y="556" font-size="15" fill="#ffffff">Planner, Dynamics, Jira</text>
    </g>
    <g>
      <rect x="775" y="438" width="260" height="96" rx="18" fill="#298582"/>
      <text x="905" y="474" font-size="21" font-weight="700" fill="#ffffff">Custom/API</text>
      <text x="905" y="504" font-size="15" fill="#ffffff">HTTP, webhooks, custom connectors</text>
    </g>
  </g>
</svg>
