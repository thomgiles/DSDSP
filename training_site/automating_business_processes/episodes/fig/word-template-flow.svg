<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 125 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Word template workflow</title>
  <desc id="desc">Excel row values populate content controls in a Word template, then the document is saved, optionally converted to PDF, and sent or stored.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#10263b" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#405162"/>
    </marker>
  </defs>
  <rect y="125" width="1200" height="360" rx="28" fill="#f7fbfc"/>
  <g stroke="#405162" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M295 210 L440 300"/>
    <path d="M295 410 L440 320"/>
    <path d="M610 310 L700 310"/>
    <path d="M860 310 L950 310"/>
  </g>
  <g font-family="Arial, sans-serif" text-anchor="middle" filter="url(#shadow)">
    <rect x="80" y="155" width="215" height="110" rx="22" fill="#006781"/>
    <rect x="80" y="355" width="215" height="110" rx="22" fill="#298582"/>
    <rect x="440" y="235" width="170" height="150" rx="24" fill="#009bc1"/>
    <rect x="700" y="250" width="160" height="120" rx="22" fill="#405162"/>
    <rect x="950" y="250" width="170" height="120" rx="22" fill="#10263b"/>
  </g>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#fff">
    <text x="188" y="195" font-size="21" font-weight="700">Word .docx</text>
    <text x="188" y="222" font-size="16">template with</text>
    <text x="188" y="244" font-size="16">content controls</text>
    <text x="188" y="395" font-size="21" font-weight="700">Excel table</text>
    <text x="188" y="422" font-size="16">one row per</text>
    <text x="188" y="444" font-size="16">recipient/document</text>
    <text x="525" y="286" font-size="21" font-weight="700">Merge values</text>
    <text x="525" y="314" font-size="17">into Word</text>
    <text x="525" y="339" font-size="17">placeholders</text>
    <text x="780" y="292" font-size="21" font-weight="700">Create</text>
    <text x="780" y="320" font-size="17">personalised</text>
    <text x="780" y="344" font-size="17">document</text>
    <text x="1035" y="286" font-size="21" font-weight="700">Send or</text>
    <text x="1035" y="314" font-size="17">store output</text>
    <text x="1035" y="339" font-size="15">PDF optional</text>
  </g>
</svg>
