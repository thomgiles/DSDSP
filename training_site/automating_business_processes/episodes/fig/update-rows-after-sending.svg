<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Update rows after sending emails</title>
  <desc id="desc">A mailout workflow sends only ready rows, updates status and sent time after sending, and skips rows that have already been sent.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#10263b" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#405162"/>
    </marker>
  </defs>
  <rect width="1200" height="620" rx="28" fill="#f7fbfc"/>
  <text x="600" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#10263b">Update the Row After the Action</text>
  <text x="600" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#405162">The update step is what stops the same row being processed again.</text>

  <g stroke="#405162" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <path d="M250 300 L350 300"/>
    <path d="M515 300 L615 300"/>
    <path d="M780 300 L880 300"/>
    <path d="M980 250 C1035 190 1025 135 960 120"/>
    <path d="M920 390 C730 500 430 500 240 390"/>
  </g>

  <g font-family="Arial, sans-serif" text-anchor="middle" filter="url(#shadow)">
    <rect x="80" y="225" width="170" height="150" rx="22" fill="#006781"/>
    <rect x="350" y="225" width="165" height="150" rx="22" fill="#298582"/>
    <rect x="615" y="225" width="165" height="150" rx="22" fill="#009bc1"/>
    <rect x="880" y="225" width="190" height="150" rx="22" fill="#405162"/>
    <rect x="775" y="80" width="185" height="80" rx="18" fill="#10263b"/>
  </g>

  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#ffffff">
    <text x="165" y="278" font-size="21" font-weight="700">Excel row</text>
    <text x="165" y="306" font-size="16">Status = Ready</text>
    <text x="165" y="330" font-size="16">SentAt is blank</text>

    <text x="432" y="278" font-size="21" font-weight="700">Send email</text>
    <text x="432" y="306" font-size="16">or document</text>
    <text x="432" y="330" font-size="16">to recipient</text>

    <text x="698" y="278" font-size="21" font-weight="700">Update row</text>
    <text x="698" y="306" font-size="16">Status = Sent</text>
    <text x="698" y="330" font-size="16">SentAt = now</text>

    <text x="975" y="272" font-size="21" font-weight="700">Next run</text>
    <text x="975" y="302" font-size="16">skip rows that</text>
    <text x="975" y="326" font-size="16">are already sent</text>

    <text x="868" y="113" font-size="18" font-weight="700">Duplicate</text>
    <text x="868" y="138" font-size="18" font-weight="700">protection</text>
  </g>

  <rect x="250" y="510" width="700" height="58" rx="16" fill="#ffffff" stroke="#d8e3e8" stroke-width="2"/>
  <text x="600" y="546" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#10263b">For mailouts, sending is not complete until the tracker has been updated.</text>
</svg>
