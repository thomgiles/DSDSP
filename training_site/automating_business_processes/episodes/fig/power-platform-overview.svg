<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Power Automate in the Microsoft Power Platform</title>
  <desc id="desc">Four Power Platform tools shown as cards: Power Automate for workflows, Power Apps for low-code apps and forms, Power BI for analysis and visualisation, and Power Pages for external-facing business websites.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#10263b" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="1200" height="620" rx="28" fill="#f7fbfc"/>
  <text x="600" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#10263b">Power Automate Is One Part of the Power Platform</text>
  <text x="600" y="94" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#405162">This module focuses on cloud flows: automations that run across Microsoft 365 and connected services.</text>

  <g font-family="Arial, sans-serif" filter="url(#shadow)">
    <rect x="90" y="165" width="240" height="255" rx="24" fill="#006781"/>
    <rect x="360" y="165" width="240" height="255" rx="24" fill="#298582"/>
    <rect x="630" y="165" width="240" height="255" rx="24" fill="#009bc1"/>
    <rect x="900" y="165" width="240" height="255" rx="24" fill="#405162"/>
  </g>

  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#ffffff">
    <circle cx="210" cy="225" r="28" fill="#ffffff" fill-opacity="0.18"/>
    <path d="M195 225 H225 M215 215 L225 225 L215 235" stroke="#ffffff" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="210" y="292" font-size="25" font-weight="700">Power Automate</text>
    <text x="210" y="332" font-size="18">Automate workflows</text>
    <text x="210" y="358" font-size="18">between systems</text>

    <circle cx="480" cy="225" r="28" fill="#ffffff" fill-opacity="0.18"/>
    <rect x="463" y="210" width="34" height="30" rx="5" fill="none" stroke="#ffffff" stroke-width="5"/>
    <path d="M463 222 H497" stroke="#ffffff" stroke-width="5"/>
    <text x="480" y="292" font-size="25" font-weight="700">Power Apps</text>
    <text x="480" y="332" font-size="18">Build low-code</text>
    <text x="480" y="358" font-size="18">apps and forms</text>

    <circle cx="750" cy="225" r="28" fill="#ffffff" fill-opacity="0.18"/>
    <rect x="732" y="225" width="8" height="18" fill="#ffffff"/>
    <rect x="746" y="213" width="8" height="30" fill="#ffffff"/>
    <rect x="760" y="202" width="8" height="41" fill="#ffffff"/>
    <text x="750" y="292" font-size="25" font-weight="700">Power BI</text>
    <text x="750" y="332" font-size="18">Analyse and</text>
    <text x="750" y="358" font-size="18">visualise data</text>

    <circle cx="1020" cy="225" r="28" fill="#ffffff" fill-opacity="0.18"/>
    <path d="M1002 235 H1038 M1007 216 H1033 M1010 207 H1030" stroke="#ffffff" stroke-width="5" fill="none" stroke-linecap="round"/>
    <text x="1020" y="292" font-size="25" font-weight="700">Power Pages</text>
    <text x="1020" y="332" font-size="18">Build external</text>
    <text x="1020" y="358" font-size="18">business websites</text>
  </g>

  <rect x="300" y="485" width="600" height="72" rx="18" fill="#ffffff" stroke="#d8e3e8" stroke-width="2"/>
  <text x="600" y="528" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#10263b">Use Power Automate when the process is about movement, decisions, and records.</text>
</svg>
