<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Approval loop with decision record</title>
  <desc id="desc">A flow requests approval, receives a decision, records the outcome, and notifies the requester.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#405162"/>
    </marker>
  </defs>
  <rect width="1200" height="560" rx="28" fill="#f7fbfc"/>
  <text x="600" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#10263b">Approvals Are Decision Records</text>
  <text x="600" y="94" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#405162">The message matters, but the recorded outcome matters more.</text>

  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="80" y="220" width="190" height="100" rx="18" fill="#006781"/>
    <text x="175" y="258" font-size="22" font-weight="700" fill="#ffffff">Flow</text>
    <text x="175" y="288" font-size="15" fill="#ffffff">creates request</text>

    <rect x="350" y="130" width="210" height="100" rx="18" fill="#298582"/>
    <text x="455" y="168" font-size="22" font-weight="700" fill="#ffffff">Approver</text>
    <text x="455" y="198" font-size="15" fill="#ffffff">approve or reject</text>

    <rect x="650" y="220" width="220" height="100" rx="18" fill="#405162"/>
    <text x="760" y="258" font-size="22" font-weight="700" fill="#ffffff">Tracker</text>
    <text x="760" y="288" font-size="15" fill="#ffffff">outcome + comments</text>

    <rect x="950" y="220" width="190" height="100" rx="18" fill="#009bc1"/>
    <text x="1045" y="258" font-size="22" font-weight="700" fill="#ffffff">Requester</text>
    <text x="1045" y="288" font-size="15" fill="#ffffff">clear response</text>
  </g>

  <g stroke="#405162" stroke-width="5" marker-end="url(#arrow)" fill="none">
    <path d="M270 245 C315 205 325 185 344 180"/>
    <path d="M560 180 C620 190 635 220 650 248"/>
    <path d="M870 270 H940"/>
    <path d="M650 295 C520 420 270 410 190 322"/>
  </g>

  <g font-family="Arial, sans-serif" font-size="15" fill="#405162">
    <text x="302" y="190">approval request</text>
    <text x="588" y="188">decision</text>
    <text x="882" y="252">notify</text>
    <text x="372" y="424">run history keeps technical trace</text>
  </g>
</svg>
