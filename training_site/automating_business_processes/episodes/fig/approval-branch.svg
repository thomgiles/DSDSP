<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Branching on an approval outcome</title>
  <desc id="desc">A Power Automate condition checks whether the approval outcome is Approve, then routes to approved or rejected handling.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#10263b" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#405162"/>
    </marker>
  </defs>
  <rect width="1200" height="620" rx="28" fill="#f7fbfc"/>
  <text x="600" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#10263b">Branch on the Approval Outcome</text>
  <text x="600" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#405162">Use the response from the approval action to decide what happens next.</text>

  <g stroke="#405162" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <path d="M285 305 L430 305"/>
    <path d="M610 250 C690 185 760 165 845 170"/>
    <path d="M610 360 C690 425 760 445 845 440"/>
    <path d="M1035 215 C1080 270 1080 340 1035 395"/>
  </g>

  <g font-family="Arial, sans-serif" text-anchor="middle" filter="url(#shadow)">
    <rect x="80" y="245" width="205" height="120" rx="22" fill="#006781"/>
    <polygon points="520,205 650,305 520,405 390,305" fill="#ffffff" stroke="#009bc1" stroke-width="4"/>
    <rect x="845" y="125" width="205" height="100" rx="22" fill="#298582"/>
    <rect x="845" y="395" width="205" height="100" rx="22" fill="#405162"/>
  </g>

  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="182" y="290" font-size="21" font-weight="700" fill="#ffffff">Approval</text>
    <text x="182" y="318" font-size="16" fill="#ffffff">response</text>
    <text x="182" y="342" font-size="16" fill="#ffffff">captured</text>

    <text x="520" y="285" font-size="18" font-weight="700" fill="#10263b">Outcome</text>
    <text x="520" y="311" font-size="18" font-weight="700" fill="#10263b">equals</text>
    <text x="520" y="337" font-size="18" font-weight="700" fill="#10263b">Approve?</text>

    <text x="805" y="168" font-size="18" font-weight="700" fill="#10263b">Yes</text>
    <text x="948" y="168" font-size="21" font-weight="700" fill="#ffffff">Approved</text>
    <text x="948" y="196" font-size="16" fill="#ffffff">update record</text>
    <text x="948" y="216" font-size="16" fill="#ffffff">send confirmation</text>

    <text x="805" y="438" font-size="18" font-weight="700" fill="#10263b">No</text>
    <text x="948" y="438" font-size="21" font-weight="700" fill="#ffffff">Rejected</text>
    <text x="948" y="466" font-size="16" fill="#ffffff">record reason</text>
    <text x="948" y="486" font-size="16" fill="#ffffff">send next steps</text>
  </g>

  <rect x="260" y="520" width="680" height="56" rx="16" fill="#ffffff" stroke="#d8e3e8" stroke-width="2"/>
  <text x="600" y="555" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#10263b">Treat rejection as a valid outcome, not as a failed run.</text>
</svg>
