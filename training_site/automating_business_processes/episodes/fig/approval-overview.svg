<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 130 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">What a Power Automate approval does</title>
  <desc id="desc">An automation pauses, sends an approval card to an approver, waits for approve or reject, and then continues down the appropriate path.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#10263b" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#405162"/>
    </marker>
  </defs>
  <rect y="130" width="1200" height="330" rx="28" fill="#f7fbfc"/>

  <g stroke="#405162" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <path d="M250 300 L365 300"/>
    <path d="M635 300 L745 220"/>
    <path d="M635 300 L745 380"/>
    <path d="M930 220 L1035 300"/>
    <path d="M930 380 L1035 300"/>
  </g>

  <g font-family="Arial, sans-serif" text-anchor="middle" filter="url(#shadow)">
    <rect x="75" y="235" width="175" height="130" rx="22" fill="#006781"/>
    <rect x="365" y="160" width="270" height="280" rx="26" fill="#ffffff" stroke="#d8e3e8" stroke-width="3"/>
    <rect x="745" y="165" width="185" height="110" rx="22" fill="#298582"/>
    <rect x="745" y="325" width="185" height="110" rx="22" fill="#405162"/>
    <rect x="1035" y="240" width="120" height="120" rx="60" fill="#009bc1"/>
  </g>

  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="162" y="287" font-size="22" font-weight="700" fill="#ffffff">Flow</text>
    <text x="162" y="317" font-size="16" fill="#ffffff">reaches a</text>
    <text x="162" y="340" font-size="16" fill="#ffffff">decision point</text>

    <text x="500" y="205" font-size="24" font-weight="700" fill="#10263b">Approval card</text>
    <rect x="405" y="230" width="190" height="42" rx="10" fill="#edf4f6" stroke="#b9ccd4"/>
    <text x="500" y="258" font-size="16" fill="#405162">Title: request summary</text>
    <rect x="405" y="292" width="190" height="58" rx="10" fill="#edf4f6" stroke="#b9ccd4"/>
    <text x="500" y="319" font-size="16" fill="#405162">Details: context,</text>
    <text x="500" y="341" font-size="16" fill="#405162">deadline, comments</text>
    <rect x="405" y="372" width="82" height="34" rx="17" fill="#298582"/>
    <text x="446" y="395" font-size="15" font-weight="700" fill="#ffffff">Approve</text>
    <rect x="513" y="372" width="82" height="34" rx="17" fill="#405162"/>
    <text x="554" y="395" font-size="15" font-weight="700" fill="#ffffff">Reject</text>

    <text x="838" y="208" font-size="22" font-weight="700" fill="#ffffff">Approved</text>
    <text x="838" y="238" font-size="16" fill="#ffffff">continue the</text>
    <text x="838" y="260" font-size="16" fill="#ffffff">happy path</text>
    <text x="838" y="368" font-size="22" font-weight="700" fill="#ffffff">Rejected</text>
    <text x="838" y="398" font-size="16" fill="#ffffff">explain and</text>
    <text x="838" y="420" font-size="16" fill="#ffffff">close clearly</text>

    <text x="1095" y="292" font-size="21" font-weight="700" fill="#ffffff">Next</text>
    <text x="1095" y="320" font-size="21" font-weight="700" fill="#ffffff">step</text>
  </g>
</svg>
