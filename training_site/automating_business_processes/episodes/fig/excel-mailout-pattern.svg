<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Excel to personalised email pattern</title>
  <desc id="desc">A named Excel table feeds an apply-to-each loop, which sends only ready rows and updates status after each message.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#405162"/>
    </marker>
  </defs>
  <rect width="1200" height="620" rx="28" fill="#f7fbfc"/>
  <text x="600" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#10263b">Safe Excel-to-Email Pattern</text>
  <text x="600" y="94" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#405162">Send from controlled rows, then update the tracker to prevent duplicates.</text>

  <g font-family="Arial, sans-serif">
    <rect x="70" y="150" width="260" height="260" rx="20" fill="#ffffff" stroke="#298582" stroke-width="4"/>
    <text x="200" y="190" text-anchor="middle" font-size="24" font-weight="700" fill="#10263b">Excel table</text>
    <rect x="105" y="220" width="190" height="38" fill="#298582"/>
    <text x="200" y="245" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">MailingList</text>
    <g font-size="13" fill="#10263b">
      <text x="112" y="285">RecipientEmail</text>
      <text x="112" y="315">CourseName</text>
      <text x="112" y="345">Status = Ready</text>
      <text x="112" y="375">SentAt blank</text>
    </g>

    <rect x="440" y="160" width="300" height="88" rx="18" fill="#006781"/>
    <text x="590" y="196" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">List rows</text>
    <text x="590" y="226" text-anchor="middle" font-size="15" fill="#ffffff">read the named table</text>

    <rect x="440" y="320" width="300" height="88" rx="18" fill="#405162"/>
    <text x="590" y="356" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">Apply to each</text>
    <text x="590" y="386" text-anchor="middle" font-size="15" fill="#ffffff">process one row at a time</text>

    <path d="M880 220 L1020 220 L1020 320 L880 320 Z" fill="#009bc1"/>
    <text x="950" y="258" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">Ready?</text>
    <text x="950" y="288" text-anchor="middle" font-size="15" fill="#ffffff">status check</text>

    <rect x="820" y="420" width="260" height="88" rx="18" fill="#298582"/>
    <text x="950" y="456" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">Send + update</text>
    <text x="950" y="486" text-anchor="middle" font-size="15" fill="#ffffff">Status = Sent, add SentAt</text>
  </g>

  <g stroke="#405162" stroke-width="5" marker-end="url(#arrow)" fill="none">
    <path d="M330 280 C380 250 390 212 430 204"/>
    <path d="M590 248 V310"/>
    <path d="M740 364 C790 350 820 314 872 290"/>
    <path d="M950 320 V410"/>
  </g>

  <g font-family="Arial, sans-serif" font-size="15" fill="#405162">
    <text x="765" y="330">only send ready rows</text>
    <text x="915" y="390">no duplicate sends</text>
  </g>
</svg>
