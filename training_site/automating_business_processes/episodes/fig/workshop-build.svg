<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Power Automate workflow built in the workshop</title>
  <desc id="desc">The workshop workflow starts with a manual request, creates a summary, sends a notification, routes with expressions, asks for approval, reads Excel rows, sends emails, and checks records.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#10263b" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#405162"/>
    </marker>
  </defs>
  <rect width="1200" height="620" rx="28" fill="#f7fbfc"/>
  <text x="600" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#10263b">The Full Practice Flow</text>
  <text x="600" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#405162">Each activity added one more production habit to the same automation pattern.</text>
  <g stroke="#405162" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M235 215 L315 215"/>
    <path d="M475 215 L555 215"/>
    <path d="M715 215 L795 215"/>
    <path d="M875 265 L875 335"/>
    <path d="M795 405 L715 405"/>
    <path d="M555 405 L475 405"/>
    <path d="M315 405 L235 405"/>
  </g>
  <g font-family="Arial, sans-serif" text-anchor="middle" filter="url(#shadow)">
    <rect x="75" y="165" width="160" height="100" rx="20" fill="#006781"/>
    <rect x="315" y="165" width="160" height="100" rx="20" fill="#298582"/>
    <rect x="555" y="165" width="160" height="100" rx="20" fill="#009bc1"/>
    <rect x="795" y="165" width="160" height="100" rx="20" fill="#405162"/>
    <rect x="795" y="355" width="160" height="100" rx="20" fill="#006781"/>
    <rect x="555" y="355" width="160" height="100" rx="20" fill="#298582"/>
    <rect x="315" y="355" width="160" height="100" rx="20" fill="#009bc1"/>
    <rect x="75" y="355" width="160" height="100" rx="20" fill="#10263b"/>
  </g>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#fff">
    <text x="155" y="207" font-size="18" font-weight="700">Manual</text>
    <text x="155" y="232" font-size="15">request</text>
    <text x="395" y="207" font-size="18" font-weight="700">Request</text>
    <text x="395" y="232" font-size="15">summary</text>
    <text x="635" y="207" font-size="18" font-weight="700">Connector</text>
    <text x="635" y="232" font-size="15">notification</text>
    <text x="875" y="207" font-size="18" font-weight="700">Expressions</text>
    <text x="875" y="232" font-size="15">and routing</text>
    <text x="875" y="397" font-size="18" font-weight="700">Approval</text>
    <text x="875" y="422" font-size="15">decision</text>
    <text x="635" y="397" font-size="18" font-weight="700">Excel table</text>
    <text x="635" y="422" font-size="15">rows</text>
    <text x="395" y="397" font-size="18" font-weight="700">Personalised</text>
    <text x="395" y="422" font-size="15">test emails</text>
    <text x="155" y="397" font-size="18" font-weight="700">Run history</text>
    <text x="155" y="422" font-size="15">and records</text>
  </g>
  <text x="600" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#10263b">The production version can swap the trigger or record source without changing the core pattern.</text>
</svg>
