<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="title desc">
  <title id="title">Prompt chain workflow</title>
  <desc id="desc">A staged prompt chain separates task definition, initial answer, critique, refinement, and source verification.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2 2 L10 6 L2 10 Z" fill="#405162"/></marker>
    <marker id="arrow-light" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2 2 L10 6 L2 10 Z" fill="#009bc1"/></marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="145%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#10263b" flood-opacity="0.15"/></filter>
  </defs>
  <rect width="1200" height="250" rx="28" fill="#f7fbfc"/>
  <g filter="url(#shadow)">
    <rect x="55.0" y="70" width="195.6" height="96" rx="18" fill="#006781"/>
    <rect x="278.6" y="70" width="195.6" height="96" rx="18" fill="#298582"/>
    <rect x="502.2" y="70" width="195.6" height="96" rx="18" fill="#405162"/>
    <rect x="725.8" y="70" width="195.6" height="96" rx="18" fill="#009bc1"/>
    <rect x="949.4" y="70" width="195.6" height="96" rx="18" fill="#10263b"/>
  </g>
  <g stroke="#405162" stroke-width="5" marker-end="url(#arrow)" fill="none">
    <path d="M256.6 118.0 H270.6"/>
    <path d="M480.2 118.0 H494.2"/>
    <path d="M703.8 118.0 H717.8"/>
    <path d="M927.4 118.0 H941.4"/>
  </g><g font-family="sans-serif">
<text x="152.8" y="113.0" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Define the</text>
<text x="152.8" y="135.0" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">task</text>
<text x="376.40000000000003" y="102.0" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">First</text>
<text x="376.40000000000003" y="124.0" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">structured</text>
<text x="376.40000000000003" y="146.0" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">answer</text>
<text x="600.0" y="113.0" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Interrogate</text>
<text x="600.0" y="135.0" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">gaps</text>
<text x="823.5999999999999" y="124.0" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Refine format</text>
<text x="1047.2" y="113.0" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Verify sources</text>
<text x="1047.2" y="135.0" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">or data</text>
  </g>
</svg>
