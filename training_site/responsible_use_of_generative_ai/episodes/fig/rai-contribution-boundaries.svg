<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="370" viewBox="0 0 1200 370" role="img" aria-labelledby="title desc">
  <title id="title">Contribution boundary examples</title>
  <desc id="desc">Different types of AI use range from surface editing to structural shaping, substantive contribution, and credentialed output.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2 2 L10 6 L2 10 Z" fill="#405162"/></marker>
    <marker id="arrow-light" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2 2 L10 6 L2 10 Z" fill="#009bc1"/></marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="145%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#10263b" flood-opacity="0.15"/></filter>
  </defs>
  <rect width="1200" height="370" rx="28" fill="#f7fbfc"/>
  <g stroke="#405162" stroke-width="4" marker-end="url(#arrow)" fill="none">
    <path d="M375 100 H585"/>
    <path d="M375 190 H585"/>
    <path d="M375 280 H585"/>
  </g><g filter="url(#shadow)" font-family="sans-serif">
    <rect x="80" y="55" width="295" height="70" rx="18" fill="#006781"/>
    <rect x="585" y="55" width="295" height="70" rx="18" fill="#006781" fill-opacity="0.88"/>
    <rect x="80" y="145" width="295" height="70" rx="18" fill="#298582"/>
    <rect x="585" y="145" width="295" height="70" rx="18" fill="#298582" fill-opacity="0.88"/>
    <rect x="80" y="235" width="295" height="70" rx="18" fill="#405162"/>
    <rect x="585" y="235" width="295" height="70" rx="18" fill="#405162" fill-opacity="0.88"/>
    <rect x="665" y="145" width="390" height="90" rx="22" fill="#10263b"/>
  </g><g font-family="sans-serif">
<text x="227.5" y="94.0" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Surface editing</text>
<text x="732.5" y="94.0" font-size="15" font-weight="650" fill="#ffffff" text-anchor="middle">grammar, clarity</text>
<text x="227.5" y="184.0" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Structural shaping</text>
<text x="732.5" y="184.0" font-size="15" font-weight="650" fill="#ffffff" text-anchor="middle">outline, framing</text>
<text x="227.5" y="263.0" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Substantive</text>
<text x="227.5" y="285.0" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">contribution</text>
<text x="732.5" y="263.0" font-size="15" font-weight="650" fill="#ffffff" text-anchor="middle">ideas, claims,</text>
<text x="732.5" y="285.0" font-size="15" font-weight="650" fill="#ffffff" text-anchor="middle">methods</text>
<text x="860" y="195.0" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">Credentialed output</text>
<text x="860" y="223.0" font-size="14" font-weight="650" fill="#ffffff" text-anchor="middle">assessment / publication</text>
  </g>
</svg>
