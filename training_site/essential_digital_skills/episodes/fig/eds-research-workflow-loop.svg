<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Research workflow loop</title>
  <desc id="desc">A research workflow pipeline showing collection, analysis, collaboration, publication, and feedback into future collection.</desc>
  <defs>
    <marker id="arrow" markerWidth="13" markerHeight="13" refX="10" refY="6.5" orient="auto">
      <path d="M2 2 L10 6.5 L2 11 Z" fill="#405162"/>
    </marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="145%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#10263b" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="1200" height="390" rx="28" fill="#f7fbfc"/>

  <g fill="none" stroke="#405162" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M268 154 H348"/>
    <path d="M548 154 H628"/>
    <path d="M828 154 H908"/>
    <path d="M1012 202 C1012 252 830 292 735 292"/>
    <path d="M465 292 C330 292 178 252 178 214"/>
  </g>
  <g fill="#405162">
    <polygon points="348,144 370,154 348,164"/>
    <polygon points="628,144 650,154 628,164"/>
    <polygon points="908,144 930,154 908,164"/>
    <polygon points="735,282 713,292 735,302"/>
    <polygon points="168,214 178,192 188,214"/>
  </g>

  <g font-family="sans-serif" filter="url(#shadow)">
    <rect x="88" y="106" width="180" height="96" rx="18" fill="#006781"/>
    <rect x="348" y="106" width="200" height="96" rx="18" fill="#298582"/>
    <rect x="628" y="106" width="200" height="96" rx="18" fill="#405162"/>
    <rect x="908" y="106" width="208" height="96" rx="18" fill="#009bc1"/>
    <rect x="465" y="262" width="270" height="60" rx="18" fill="#10263b"/>
  </g>

  <g font-family="sans-serif" fill="#ffffff" text-anchor="middle">
    <text x="178" y="149" font-size="17" font-weight="700">Data</text>
    <text x="178" y="173" font-size="17" font-weight="700">Collection</text>
    <text x="448" y="161" font-size="18" font-weight="700">Analysis</text>
    <text x="728" y="161" font-size="18" font-weight="700">Collaboration</text>
    <text x="1012" y="149" font-size="17" font-weight="700">Publication &amp;</text>
    <text x="1012" y="173" font-size="17" font-weight="700">Sharing</text>
    <text x="600" y="301" font-size="17" font-weight="700">Questions for the next cycle</text>
  </g>
</svg>
