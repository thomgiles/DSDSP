name: dsdsp-dev-$(Date:yyyyMMdd)

trigger:
  branches:
    include:
      - Dev

pr:
  branches:
    include:
      - Dev

jobs:
- job: build_and_deploy_job
  displayName: Build and Deploy Job
  timeoutInMinutes: 240

  pool:
    vmImage: ubuntu-24.04

  variables:
    - group: Azure-Static-Web-Apps-victorious-moss-01eb84103-variable-group

  steps:
    - checkout: self
      submodules: true

    # ---- R setup ---------------------------------------------------------
    - script: |
        set -eux

        sudo apt-get update

        sudo apt-get install -y --no-install-recommends \
          curl \
          ca-certificates \
          libxml2-dev \
          libcurl4-openssl-dev \
          libssl-dev \
          libuv1-dev \
          libfontconfig1-dev \
          libfreetype6-dev \
          libharfbuzz-dev \
          libfribidi-dev \
          libpng-dev \
          libtiff5-dev \
          libjpeg-dev \
          libgl1-mesa-dev \
          libgmp-dev \
          librsvg2-bin \
          fonts-noto-cjk \
          fonts-dejavu \
          ghostscript \
          pandoc \
          r-base

        R --version
      displayName: 'Set up R and system dependencies'

    # ---- R package restore -----------------------------------------------
    - script: |
        set -eux

        # Force the normal project environment.
        # This prevents renv from using:
        # renv/profiles/lesson-requirements/renv.lock
        unset RENV_PROFILE
        rm -f renv/profile

        mkdir -p "$HOME/.R/library"

        export R_LIBS_USER="$HOME/.R/library"
        echo 'R_LIBS_USER="~/.R/library"' > "$HOME/.Renviron"

        Rscript --vanilla -e 'options(repos = c(CRAN = "https://cloud.r-project.org")); install.packages("renv")'

        Rscript --vanilla -e '
          Sys.unsetenv("RENV_PROFILE")
          renv::consent(provided = TRUE)
          renv::restore(lockfile = "renv.lock", prompt = FALSE)
        '

        Rscript --vanilla -e '
          pkgs <- c(
            "rmarkdown",
            "gapminder",
            "tidyverse",
            "readxl",
            "openxlsx",
            "gridExtra",
            "ggExtra",
            "knitr"
          )

          missing <- pkgs[!vapply(pkgs, requireNamespace, logical(1), quietly = TRUE)]

          if (length(missing)) {
            stop("Missing R packages after restore: ", paste(missing, collapse = ", "))
          }

          cat("R package check passed\n")
        '
      workingDirectory: training_site
      displayName: 'Restore R environment'

    # ---- Python setup ----------------------------------------------------
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.11'
      displayName: 'Set up Python 3.11'

    - script: |
        set -eux

        python -m pip install --upgrade pip

        if [ -f requirements.txt ]; then
          pip install -r requirements.txt
        fi

        pip install jupyter pyyaml
      workingDirectory: training_site
      displayName: 'Install Python packages'

    # ---- Quarto setup ----------------------------------------------------
    - script: |
        set -eux

        # Install Tectonic manually.
        curl -sSL \
          https://github.com/tectonic-typesetting/tectonic/releases/latest/download/tectonic-x86_64-unknown-linux-gnu.deb \
          -o tectonic.deb

        sudo dpkg -i tectonic.deb || sudo apt-get -f install -y

        # Install Quarto.
        curl -sSLO https://quarto.org/download/latest/quarto-linux-amd64.deb
        sudo dpkg -i quarto-linux-amd64.deb || sudo apt-get -f install -y

        quarto --version

        # TinyTeX fallback for PDF rendering.
        quarto install tinytex
      displayName: 'Install Quarto CLI and PDF dependencies'

    # ---- Render step -----------------------------------------------------
    - script: |
        set -eux

        unset RENV_PROFILE

        export R_LIBS_USER="$HOME/.R/library"
        export QUARTO_TMPDIR="$PWD/.tmp"
        export PATH="$PATH:$HOME/.TinyTeX/bin/x86_64-linux"

        mkdir -p "$QUARTO_TMPDIR"

        echo "R_LIBS_USER=$R_LIBS_USER"
        echo "QUARTO_TMPDIR=$QUARTO_TMPDIR"

        quarto render . --no-cache --log-level debug

        echo "Render complete. Listing output:"
        ls -al _site || echo "_site not found"

        test -f _site/index.html
      workingDirectory: training_site
      displayName: 'Render Quarto site'

    # ---- Deploy step -----------------------------------------------------
    - task: AzureStaticWebApp@0
      inputs:
        azure_static_web_apps_api_token: $(AZURE_STATIC_WEB_APPS_API_TOKEN_VICTORIOUS_MOSS_01EB84103)
        app_location: "training_site"
        output_location: "_site"
        api_location: ""